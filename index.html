    const probe=document.getElementById('safeProbe'),probeStyle=probe?getComputedStyle(probe):null,realTop=probeStyle?parseFloat(probeStyle.paddingTop)||0:0,realBottom=probeStyle?parseFloat(probeStyle.paddingBottom)||0:0;
    topSafe=Math.max(realTop,12);bottomSafe=Math.max(realBottom,10);
    const root=document.documentElement;root.style.setProperty('--safe-top',realTop+'px');root.style.setProperty('--safe-bottom',realBottom+'px');
    const measuredH=Math.max(window.innerHeight||0,document.documentElement.clientHeight||0,vv?Math.ceil(vv.height+vv.offsetTop):0);
    if(measuredH>0)root.style.setProperty('--app-h',measuredH+'px');

    const offX=vv?vv.offsetLeft:0, offY=vv?vv.offsetTop:0;
    root.style.transform=(offX||offY)?`translate(${-offX}px,${-offY}px)`:'none';
    /* 화면 크기는 CSS 100dvh가 스스로 맞춘다(사파리 주소창이 나타나거나 사라져도 항상 꽉 참) —
       여기서는 실제로 렌더된 크기를 그대로 읽어서 캔버스 해상도만 맞춰준다. px 고정값을 강제하지 않는다. */
    const r=canvas.getBoundingClientRect();
    W=Math.ceil(Math.max(1,r.width));H=Math.ceil(Math.max(1,r.height));
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);mainCtx.setTransform(DPR,0,0,DPR,0,0);
    fxCanvas.width=canvas.width;fxCanvas.height=canvas.height;fxCtx.setTransform(DPR,0,0,DPR,0,0);

    const pr=preview.getBoundingClientRect();preview.width=Math.max(1,Math.round(pr.width*DPR));preview.height=Math.max(1,Math.round(pr.height*DPR));pctx.setTransform(DPR,0,0,DPR,0,0);

  function buildRiver(){

  /* 사각형 하나를 반지름 r 원 여러 개로 덮는다 — 세로로 긴 레고도 몸통 전체가 막힌다 */
  function coverCircles(x,y,w,h,rot){

  /* 둥근모서리 사각형 둘레를 따라 원 체인을 깔아 '벽'을 만든다 — 안쪽에서 못 나가게 */
  function roundedRectWallCircles(cx,cy,halfW,halfH,rc,circleR,spacing){

      {type:'line',x0:left+rc,y0:top,x1:right-rc,y1:top,nx:0,ny:-1},
      {type:'arc',cx:right-rc,cy:top+rc,r:rc,a0:-Math.PI/2,a1:0},
      {type:'line',x0:right,y0:top+rc,x1:right,y1:bottom-rc,nx:1,ny:0},

      {type:'line',x0:left,y0:bottom-rc,x1:left,y1:top+rc,nx:-1,ny:0},
      {type:'arc',cx:left+rc,cy:top+rc,r:rc,a0:Math.PI,a1:Math.PI*1.5},

    for(const s of segs){
      if(s.type==='line'){
        const len=Math.hypot(s.x1-s.x0,s.y1-s.y0), n=Math.max(1,Math.round(len/spacing));
        for(let i=0;i<=n;i++){ const t=i/n, px=s.x0+(s.x1-s.x0)*t, py=s.y0+(s.y1-s.y0)*t; out.push({x:px+s.nx*circleR, y:py+s.ny*circleR, r:circleR, wall:true}); }
      }else{
        const len=Math.abs(s.a1-s.a0)*s.r, n=Math.max(1,Math.round(len/spacing));
        for(let i=0;i<=n;i++){ const t=i/n, a=s.a0+(s.a1-s.a0)*t, nx=Math.cos(a), ny=Math.sin(a), px=s.cx+nx*s.r, py=s.cy+ny*s.r; out.push({x:px+nx*circleR, y:py+ny*circleR, r:circleR, wall:true}); }

  /* 타원 둘레를 따라 원 체인을 깔아 '벽'을 만든다 — 원형 경기장 밖으로 못 나가게 */

  function buildShapeGrid(canvasImg, cell){

    const cells=[];
    for(let y=cell/2; y<h; y+=cell){
      for(let x=cell/2; x<w; x+=cell){
        const i=((y|0)*w+(x|0))*4;

  function stripLightBg(img){

    const id=g.getImageData(0,0,c.width,c.height), d=id.data, w=c.width, h=c.height;
    function isBg(i4){ const r=d[i4],gg=d[i4+1],b=d[i4+2]; const low=Math.min(r,gg,b), high=Math.max(r,gg,b); return low>=205 && (high-low)<=20; }

    for(let y=0;y<h;y++){ for(const x of [0,w-1]){ const i=idx(x,y); if(!visited[i] && isBg(i*4)) stack.push(i); } }

      if(visited[i]) continue;
      if(!isBg(i*4)) continue;
      visited[i]=1; d[i*4+3]=0;
      const x=i%w, y=(i/w)|0;

  /* 재사용 가능한 소품맵 시스템(공장맵/퍼즐맵 등 스테이지2 전용 맵에서 사용) */
  function makeMapSystem(paths, props){
    const IMGCACHE={}; const PROP_BY_KEY={}; for(const p of props) PROP_BY_KEY[p.k]=p;
    function ensureProcessed(){ for(const k in paths){ if(k==='base'||IMGCACHE[k]) continue; const im=IMG[paths[k]]; if(im&&im.complete) IMGCACHE[k]=stripLightBg(im); } }
    const OBJS=[], COLS=[];
    function placeDecor(seed){
      if(OBJS.length) return;
      const R=seedRand(seed), MIN_GAP=96, queue=[];
      for(const p of props) for(let i=0;i<p.n;i++) queue.push({k:p.k, w:p.wMin+R()*(p.wMax-p.wMin), key:R()});
      queue.sort((a,b)=>a.key-b.key);
      for(const q of queue){
        const im=IMGCACHE[q.k]||IMG[paths[q.k]];
        const ar=((im&&im.height)||1)/((im&&im.width)||1);
        const w=q.w, h=w*ar, reach=Math.max(w,h)*0.5, rot=PROP_BY_KEY[q.k]?.rotFree?R()*TAU:0;
        let x,y,tries=0,ok=false,cir=null;
        do{
          x=110+R()*(WORLD-220); y=110+R()*(WORLD-220); tries++;
          cir=coverCircles(x,y,w,h,rot);
          ok = !(Math.hypot(x-CORE.x,y-CORE.y) < CORE.r*3+reach+60)
            && !cir.some(c=>COLS.some(o=>Math.hypot(o.x-c.x,o.y-c.y) < o.r+c.r+MIN_GAP));
        }while(!ok && tries<90);
        if(!ok) continue;
        const id=OBJS.length;
        OBJS.push({k:q.k, x, y, w, h, rot, flip:false});
        for(const c of cir){ c.id=id; COLS.push(c); }
      }
    }
    function drawObj(g,o){
      const im=IMGCACHE[o.k]; if(!im) return;
      g.save(); g.translate(o.x,o.y); g.rotate(o.rot||0);
      if(o.flip) g.scale(-1,1);
      g.drawImage(im,-o.w/2,-o.h/2,o.w,o.h);
      g.restore();
    }
    function bakeObjects(g){
      const list=OBJS.slice().sort((a,b)=>a.y-b.y);
      for(const o of list) drawObj(g,o);
    }
    function bakeFloor(g, fallbackColor, tile){
      const im=IMG[paths.base];
      g.fillStyle=fallbackColor; g.fillRect(0,0,WORLD,WORLD);
      if(!im||!im.complete) return;
      if(tile){
        const pat=g.createPattern(im,'repeat');
        g.save(); g.fillStyle=pat; g.fillRect(0,0,WORLD,WORLD); g.restore();
      }else{
        g.drawImage(im,0,0,WORLD,WORLD);

    return {paths, ensureProcessed, OBJS, bake, state};

  /* 스폰 위치 — 한 가지 패턴만 쓰면 항상 같은 방향에서 몰려온다. 다섯 가지를 섞는다.
     어느 패턴이든 물 위·장애물 안·화면 안(갑툭튀)에는 안 나온다 */
  function spawnPoint(){
    const pl=G.p;
    const ring=Math.max(W,H)*0.62;
    const minAway=Math.hypot(W,H)*0.55;
    for(let i=0;i<26;i++){
      const roll=Math.random(); let x,y;
      if(roll<0.38){                          // ① 플레이어 주변 링
        const a=Math.random()*TAU, rad=ring+rnd(220,40);
        x=pl.x+Math.cos(a)*rad; y=pl.y+Math.sin(a)*rad;
      } else if(roll<0.54){                    // ② 쿠키 주변
        const a=Math.random()*TAU, rad=CORE.r*4+rnd(440,0);
        x=CORE.x+Math.cos(a)*rad; y=CORE.y+Math.sin(a)*rad;
      } else if(roll<0.72){                    // ③ 맵 아무데나 (강 건너편 포함 — 다리로 넘어온다)
        x=rnd(WORLD-60,60); y=rnd(WORLD-60,60);
      } else if(roll<0.87){                    // ④ 맵 가장자리
        const e=(Math.random()*4)|0, m=rnd(170,50);
        if(e===0){ x=rnd(WORLD-50,50); y=m; }
        else if(e===1){ x=rnd(WORLD-50,50); y=WORLD-m; }
        else if(e===2){ x=m; y=rnd(WORLD-50,50); }
        else { x=WORLD-m; y=rnd(WORLD-50,50); }
      } else {                                 // ⑤ 무리 스폰 — 몇 초간 한 지점에 뭉쳐 나온다
        if(!G._cluster || G.time>G._clusterT){
          const a=Math.random()*TAU, rad=ring+rnd(420,60);
          G._cluster={x:clamp(pl.x+Math.cos(a)*rad,70,WORLD-70), y:clamp(pl.y+Math.sin(a)*rad,70,WORLD-70)};
          G._clusterT=G.time+6;
        }
        x=G._cluster.x+rnd(95,-95); y=G._cluster.y+rnd(95,-95);
      }
      x=clamp(x,50,WORLD-50); y=clamp(y,50,WORLD-50);
      if(Math.hypot(x-pl.x,y-pl.y)<minAway) continue;
      if(inWater(x,y,40)) continue;
      if(G.stage===2&&G.mode==='defense'&&!insideFactory2Rect(x,y,60)) continue;
      if(G.stage===2&&G.mode!=='defense'&&!insidePuzzle2bEllipse(x,y,60)) continue;
      if(blockedAt(x,y,34)) continue;
      return {x,y};
    }
    if(G.stage===2&&G.mode==='defense'){                // 경기장 안쪽 가장자리에서 스폰(완전 실패 시)
      const a=Math.random()*TAU, hw=FACTORY2_RECT.halfW-140, hh=FACTORY2_RECT.halfH-140;
      return {x:clamp(CORE.x+Math.cos(a)*hw,CORE.x-hw,CORE.x+hw), y:clamp(CORE.y+Math.sin(a)*hh,CORE.y-hh,CORE.y+hh)};
    }
    if(G.stage===2&&G.mode!=='defense'){                 // 원형 경기장 안쪽 가장자리에서 스폰(완전 실패 시)
      const a=Math.random()*TAU, ra=PUZZLE2B_ELLIPSE.a-140, rb=PUZZLE2B_ELLIPSE.b-140;
      return {x:CORE.x+Math.cos(a)*ra, y:CORE.y+Math.sin(a)*rb};
    }
    const a=Math.random()*TAU, rad=ring+rnd(180,40);   // 26번 실패하면 예전 방식으로
    return pushOutOfWater({x:clamp(pl.x+Math.cos(a)*rad,40,WORLD-40),y:clamp(pl.y+Math.sin(a)*rad,40,WORLD-40)},40);
  }

      }else if(f.type==='shatterFx'){

      }else if(f.type==='shockGap'){
        ctx.translate(s.x,s.y);const rad=(f.rad||300)*(.3+k*.85),a0=f.gapA+f.gapW/2,a1=f.gapA-f.gapW/2+TAU;

  function drawChargeWarn(){for(const b of G.enemies){if(b.dead||b.state!=='chargeWarn'||!b.charge)continue;const s=worldToScreen(b.charge.x,b.charge.y),half=b.midboss?42:Math.max(58,(b.r||60)*.6);ctx.save();ctx.translate(s.x,s.y);ctx.rotate(b.charge.a);ctx.fillStyle=`rgba(255,44,35,${.17+Math.sin(clock*15)*.09})`;ctx.fillRect(0,-half,b.charge.len,half*2);ctx.strokeStyle='#ff3c32';ctx.lineWidth=4;ctx.setLineDash([22,14]);ctx.strokeRect(0,-half,b.charge.len,half*2);ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='900 30px system-ui';for(let x=70;x<b.charge.len;x+=120)ctx.fillText('➤',x,10);ctx.restore();}}

      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(b.gearSpin||0);ctx.fillStyle='#c9902f';ctx.strokeStyle='#6b430f';ctx.lineWidth=2;for(let j=0;j<6;j++){ctx.save();ctx.rotate(j*TAU/6);ctx.fillRect(9,-4.5,9,9);ctx.restore();}ctx.beginPath();ctx.arc(0,0,13,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#3a2408';ctx.beginPath();ctx.arc(0,0,5,0,TAU);ctx.fill();ctx.restore();

  function drawMinimap(){const size=Math.min(92,W*.22),x=10,y=topSafe+60,pad=7,inner=size-pad*2,sc=inner/WORLD,px=v=>x+pad+clamp(v,0,WORLD)*sc,py=v=>y+pad+clamp(v,0,WORLD)*sc;ctx.save();ctx.fillStyle='rgba(10,28,17,.78)';roundRect(ctx,x,y,size,size,12);ctx.fill();ctx.strokeStyle='rgba(244,225,143,.9)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='rgba(84,142,62,.35)';ctx.fillRect(x+pad,y+pad,inner,inner);if(riverActive&&RIVER.segs.length){ctx.save();ctx.beginPath();roundRect(ctx,x+pad,y+pad,inner,inner);ctx.clip();ctx.strokeStyle='#2e9fe0';ctx.lineWidth=Math.max(2,RIVER.w*2*sc);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();RIVER.pts.forEach((p,i)=>i?ctx.lineTo(px(p[0]),py(p[1])):ctx.moveTo(px(p[0]),py(p[1])));ctx.stroke();ctx.fillStyle='#ffd166';for(const b of RIVER.bridges)ctx.fillRect(px(b.x)-3,py(b.y)-3,6,6);ctx.restore();}for(const e of G.enemies){if(e.dead)continue;ctx.fillStyle=e.boss?'#d93cff':e.midboss?'#ff9d32':'#ff5750';ctx.beginPath();ctx.arc(px(e.x),py(e.y),e.boss?3.6:e.midboss?3:1.35,0,TAU);ctx.fill();}if(G.mode==='defense'||G.mode==='hunt'){ctx.save();ctx.translate(px(CORE.x),py(CORE.y));ctx.rotate(Math.PI/4);ctx.fillStyle='#ffe26b';ctx.fillRect(-3.5,-3.5,7,7);ctx.restore();}for(const a of G.allies){if(a.dead)continue;ctx.fillStyle='#55eaff';ctx.beginPath();ctx.arc(px(a.x),py(a.y),2.5,0,TAU);ctx.fill();}ctx.fillStyle='#ffffff';ctx.strokeStyle='#2584ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px(G.p.x),py(G.p.y),3.5,0,TAU);ctx.fill();ctx.stroke();const vw=W*sc,vh=H*sc;ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=1;ctx.strokeRect(px(cam.x)-vw/2,py(cam.y)-vh/2,vw,vh);ctx.restore();}
  function drawHUD(){const y=topSafe+7,w=Math.min(W-28,650),x=(W-w)/2,barW=w-105;ctx.fillStyle='rgba(18,31,23,.78)';roundRect(ctx,x,y,barW,25,12);ctx.fill();ctx.font='800 14px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';if(G.mode==='defense'||G.mode==='hunt'){ctx.fillStyle='#ffca57';roundRect(ctx,x+2,y+2,(barW-4)*clamp(CORE.hp/CORE.maxHp,0,1),21,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(`쿠키 ${Math.max(0,Math.ceil(CORE.hp))}/${CORE.maxHp}`,x+barW/2,y+18);}else{ctx.fillStyle='#6fe2ff';roundRect(ctx,x+2,y+2,(barW-4)*clamp(G.lives/5,0,1),21,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(`남은 목숨 ${G.lives}/5 · 무한 생존`,x+barW/2,y+18);}
    ctx.fillStyle='rgba(18,31,23,.84)';roundRect(ctx,x+w-96,y,58,34,13);ctx.fill();ctx.font='900 14px system-ui';ctx.fillStyle='#fff4a5';ctx.fillText(formatTime(G.time),x+w-67,y+22);roundRect(ctx,x+w-32,y,32,34,11);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+w-24,y+9,5,17);ctx.fillRect(x+w-14,y+9,5,17);

  function drawArena(){const ar=G.arena;if(!ar)return;const s=worldToScreen(ar.x,ar.y),curR=ar.r*(ar.formK??1),stage2=G.stage===2;
    ctx.save();ctx.translate(s.x,s.y);ctx.beginPath();const pts=[];

      for(let i=0;i<pts.length-1;i+=2){const p=pts[i];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle='rgba(200,210,225,.95)';ctx.strokeStyle='rgba(90,95,105,.95)';ctx.lineWidth=1.6;ctx.fillRect(-3,-6,20,12);ctx.strokeRect(-3,-6,20,12);ctx.restore();}
    }else{ctx.strokeStyle=`rgba(140,225,100,${.30+glowPulse*.14})`;ctx.lineWidth=30;ctx.stroke();ctx.strokeStyle=`rgba(120,235,90,${.92+glowPulse*.08})`;ctx.lineWidth=7;ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
      for(let i=0;i<pts.length-1;i+=3){const p=pts[i];ctx.beginPath();ctx.fillStyle='rgba(110,210,80,.95)';ctx.arc(p.x,p.y,9,0,TAU);ctx.fill();ctx.beginPath();ctx.fillStyle='rgba(70,160,45,.95)';ctx.ellipse(p.x,p.y,4,7,p.a,0,TAU);ctx.fill();}}

  function draw(){drawMap();drawArena();drawChests();drawChargeWarn();drawRobotBossHud();const sorted=G.enemies.filter(e=>!e.dead||e.deadT>0).sort((a,b)=>a.y-b.y);for(const e of sorted){if(e.frozenT>0){ctx.save();ctx.filter='hue-rotate(190deg) saturate(2.4) brightness(1.08)';drawEnemy(e);ctx.restore();}else drawEnemy(e);}drawDrops();

  function endGame(win,reason='player'){if(state==='gameover')return;state='gameover';AudioMgr.engine(false);const p=G.p;saveSurvivalRecord(G.time,G.stage);$('#overTitle').textContent=win?`${MODES[G.mode].name} 성공!`:reason==='cookie'?'쿠키를 빼앗겼어요!':'장난감 원정대가 쓰러졌어요!';$('#overStats').innerHTML=statHtml(G.wave,'도달 웨이브')+statHtml(G.kills,'몬스터 처치')+statHtml(p.level,'레벨');showScreen('#gameover');}
