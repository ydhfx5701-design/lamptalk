<body>
  <canvas id="game"></canvas>
  <div id="loading"><div class="load-logo">TOY BATTLE</div><div class="load-track"><div id="loadFill"></div></div><p>장난감 원정대 준비 중…</p></div>

    <div class="select-panel">

      <div class="char-row"><button id="prevChar" class="round-btn">‹</button><div class="char-info"><div id="charName"></div><div id="charWeapon"></div></div><button id="nextChar" class="round-btn">›</button></div>

        <div class="select-line"><span class="setup-label">무기</span><button class="pick-arrow" data-pick="weapon" data-step="-1">‹</button><div id="weaponChoice" class="choice-box"></div><button class="pick-arrow" data-pick="weapon" data-step="1">›</button></div>

    </div>
  </section>
  <section id="pause" class="screen overlay"><div class="modal"><h2>일시정지</h2><p id="pauseModeText">밀림도 잠깐 숨을 고르고 있어요.</p><div id="pauseStats" class="stats"></div><div class="pause-section"><h3>획득 무기 · 아이템</h3><div id="pauseLoadout" class="detail-grid"></div></div><div class="pause-section"><h3>현재 능력치</h3><div id="pauseDetailStats" class="detail-grid"></div></div><div class="pause-section"><h3>사운드 설정</h3><label class="sound-row"><span>음악</span><input id="bgmVol" type="range" min="0" max="100" value="18"><output id="bgmOut">18</output></label><label class="sound-row"><span>효과음</span><input id="sfxVol" type="range" min="0" max="100" value="100"><output id="sfxOut">100</output></label></div><button id="resumeBtn" class="menu-btn accent">계속하기</button><button id="quitBtn" class="menu-btn">메인화면</button></div></section>
  <section id="levelup" class="screen overlay"><div class="modal"><h2>장난감 강화!</h2><p>새 장비를 고르거나 가진 장비를 강화하세요.</p><div id="upgradeGrid" class="upgrade-grid"></div></div></section>

    if(!e.boss&&!e.dead&&e.hp<e.maxHp){const bw=e.midboss?e.r*2.5:e.r*2,bh=e.midboss?7:5;ctx.fillStyle='#2a1c1c';ctx.fillRect(s.x-bw/2,s.y-e.r-16,bw,bh);ctx.fillStyle=e.midboss?'#ffb632':'#ff6c52';ctx.fillRect(s.x-bw/2,s.y-e.r-16,bw*(e.hp/e.maxHp),bh);}
  }
  function drawProjectiles(){for(const p of G.projectiles){const s=worldToScreen(p.x,p.y);ctx.save();ctx.translate(s.x,s.y);if(p.type==='dart'){ctx.rotate(Math.atan2(p.vy,p.vx));ctx.fillStyle='#ff9a2f';roundRect(ctx,-10,-3,20,6,3);ctx.fill();ctx.fillStyle='#ffe37c';ctx.fillRect(5,-3,5,6);}else if(p.type==='waterShot'){ctx.rotate(Math.atan2(p.vy,p.vx));const g=ctx.createLinearGradient(-15,0,12,0);g.addColorStop(0,'rgba(52,192,255,0)');g.addColorStop(.46,'#49d9ff');g.addColorStop(1,'#eaffff');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-16,0);ctx.quadraticCurveTo(-2,-7,11,0);ctx.quadraticCurveTo(-2,7,-16,0);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-2,2.2,0,TAU);ctx.fill();}else if(p.type==='bubble'){ctx.fillStyle=p.color;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(0,0,p.r,0,TAU);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3,-3,2,0,TAU);ctx.fill();}else if(p.type==='spring'){const o=worldToScreen(p.ox,p.oy);ctx.restore();ctx.save();ctx.strokeStyle='#d9dde3';ctx.lineWidth=4;ctx.beginPath();const n=12;for(let j=0;j<=n;j++){const q=j/n,x=o.x+(s.x-o.x)*q,y=o.y+(s.y-o.y)*q+Math.sin(q*n*Math.PI)*5;if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.fillStyle='#ff5a4d';ctx.beginPath();ctx.arc(s.x,s.y,17,0,TAU);ctx.fill();ctx.strokeStyle='#9e1f2d';ctx.lineWidth=4;ctx.stroke();}ctx.restore();}}
  function drawEnemyBullets(){for(const b of G.enemyBullets){const s=worldToScreen(b.x,b.y);const g=ctx.createRadialGradient(s.x-2,s.y-2,1,s.x,s.y,b.r*2);g.addColorStop(0,'#eaffb1');g.addColorStop(.4,'#7dff40');g.addColorStop(1,'#2c741000');ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,b.r*2,0,TAU);ctx.fill();ctx.fillStyle='#62e72f';ctx.beginPath();ctx.arc(s.x,s.y,b.r,0,TAU);ctx.fill();}}
  function drawDrops(){for(const d of G.drops){const s=worldToScreen(d.x,d.y),b=Math.sin(d.t*6)*3;ctx.save();ctx.translate(s.x,s.y+b);ctx.rotate(d.t*2);ctx.fillStyle=d.xp>20?'#ffcf35':'#ff8d45';ctx.fillRect(-7,-7,14,14);ctx.fillStyle='#fff2a3';ctx.beginPath();ctx.moveTo(-7,-5);ctx.lineTo(-13,0);ctx.lineTo(-7,5);ctx.fill();ctx.beginPath();ctx.moveTo(7,-5);ctx.lineTo(13,0);ctx.lineTo(7,5);ctx.fill();ctx.restore();}}
  function drawChests(){const im=IMG[DATA.items.chest];for(const h of G.chests){const s=worldToScreen(h.x,h.y);if(s.x<-70||s.x>W+70||s.y<-70||s.y>H+70)continue;const bob=Math.sin(h.t*3.2)*2,g=ctx.createRadialGradient(s.x,s.y,5,s.x,s.y,48);g.addColorStop(0,'rgba(255,220,84,.18)');g.addColorStop(1,'rgba(255,210,50,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,48,0,TAU);ctx.fill();ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(s.x,s.y+21,29,9,0,0,TAU);ctx.fill();if(im&&im.complete)ctx.drawImage(im,s.x-30,s.y-27+bob,60,48);}}
  function drawDirectionArrow(p){if(!p.walk||p.carT>0)return;const s=worldToScreen(p.x,p.y),a=Math.atan2(p.moveY,p.moveX),r=42;ctx.save();ctx.translate(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r);ctx.rotate(a);ctx.globalAlpha=.80;ctx.fillStyle='#fff2a0';ctx.strokeStyle='#345f38';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-7,-7);ctx.lineTo(-3,0);ctx.lineTo(-7,7);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
  function drawEffects(){for(const f of G.effects){const s=worldToScreen(f.x,f.y),k=f.t/(f.t+f.life);ctx.save();ctx.globalAlpha=1-k;if(f.type==='muzzle'){ctx.translate(s.x,s.y);ctx.rotate(f.a);ctx.fillStyle='#fff8b2';ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(40,0);ctx.lineTo(11,-16);ctx.lineTo(17,0);ctx.lineTo(11,16);ctx.closePath();ctx.fill();ctx.globalAlpha=.55*(1-k);ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(4,0,23*(1-k),0,TAU);ctx.fill();}else if(f.type==='water'){const e=worldToScreen(f.x2,f.y2);ctx.strokeStyle='#78edff';ctx.lineWidth=13*(1-k);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo((s.x+e.x)/2,(s.y+e.y)/2+Math.sin(f.t*40)*9,e.x,e.y);ctx.stroke();ctx.strokeStyle='#e7ffff';ctx.lineWidth=4*(1-k);ctx.stroke();}else if(f.type==='slash'||f.type==='slash2'||f.type==='smash'){ctx.translate(s.x,s.y);ctx.rotate(f.a);ctx.lineCap='round';const wide=f.type==='smash'?18:f.type==='slash2'?5:12;ctx.strokeStyle=f.color;ctx.lineWidth=wide*(1-k*.45);ctx.beginPath();ctx.arc(0,0,f.rad,-1.05+k*.32,1.05-k*.18);ctx.stroke();if(f.type!=='smash'){ctx.globalAlpha=.65*(1-k);ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,f.rad-7,-.92,.92);ctx.stroke();}}else if(f.type==='stab'){ctx.translate(s.x,s.y);ctx.rotate(f.a);ctx.strokeStyle='#fff7c4';ctx.lineCap='round';ctx.lineWidth=13*(1-k);ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(f.len*(.68+.32*k),0);ctx.stroke();ctx.strokeStyle=f.color;ctx.lineWidth=5*(1-k);ctx.stroke();}else if(f.type==='tipBurst'){ctx.translate(s.x,s.y);ctx.rotate(f.a);ctx.fillStyle=f.color;for(let i=0;i<6;i++){ctx.rotate(TAU/6);ctx.beginPath();ctx.moveTo(0,-3);ctx.lineTo((f.rad||24)*(1-k*.45),0);ctx.lineTo(0,3);ctx.closePath();ctx.fill();}}else if(f.type==='shock'){ctx.translate(s.x,s.y);ctx.strokeStyle=f.color;ctx.lineWidth=10*(1-k);ctx.beginPath();ctx.ellipse(0,8,(f.rad||50)*(.45+k*.7),(f.rad||50)*(.18+k*.28),0,0,TAU);ctx.stroke();for(let i=0;i<8;i++){ctx.rotate(TAU/8);ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo((f.rad||50)*(.65+k*.45),0);ctx.stroke();}}else if(f.type==='deathBurst'){ctx.translate(s.x,s.y);const rad=f.rad||44;ctx.fillStyle=f.color;ctx.globalAlpha=.28*(1-k);ctx.beginPath();ctx.arc(0,0,rad*(.7+k*.4),0,TAU);ctx.fill();ctx.globalAlpha=1-k;ctx.strokeStyle='#fff6bf';ctx.lineWidth=12*(1-k);ctx.beginPath();ctx.arc(0,0,rad*(.28+k*.92),0,TAU);ctx.stroke();ctx.fillStyle=f.color;for(let j=0;j<12;j++){ctx.save();ctx.rotate(j*TAU/12+k*.35);ctx.beginPath();ctx.moveTo(rad*.30,0);ctx.lineTo(rad*(.85+k*.42),-4*(1-k));ctx.lineTo(rad*(.85+k*.42),4*(1-k));ctx.closePath();ctx.fill();ctx.restore();}}else if(f.type==='deathFlash'){ctx.translate(s.x,s.y);const rad=f.rad||42;ctx.rotate(k*.22);ctx.lineCap='round';for(let j=0;j<9;j++){ctx.save();ctx.rotate(j*TAU/9);ctx.strokeStyle=j%2?'#fff8cf':f.color;ctx.lineWidth=(j%2?3:6)*(1-k);ctx.beginPath();ctx.moveTo(rad*(.12+k*.18),0);ctx.lineTo(rad*(.72+k*.45),0);ctx.stroke();ctx.restore();}ctx.rotate(-k*.45);ctx.strokeStyle='#fff';ctx.lineWidth=5*(1-k);ctx.beginPath();ctx.moveTo(-rad*.62,0);ctx.lineTo(rad*.62,0);ctx.moveTo(0,-rad*.62);ctx.lineTo(0,rad*.62);ctx.stroke();}else if(f.type==='hit'){ctx.translate(s.x,s.y);ctx.rotate(f.a);ctx.strokeStyle=f.color;ctx.lineWidth=5;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-10,i*7);ctx.lineTo(16,i*10);ctx.stroke();}}else{ctx.translate(s.x,s.y);ctx.strokeStyle=f.color;ctx.lineWidth=8*(1-k);ctx.beginPath();ctx.arc(0,0,(f.rad||35)*(.35+k*.9),0,TAU);ctx.stroke();if(f.type==='death'||f.type==='teamSpawn'){ctx.fillStyle=f.color;ctx.globalAlpha=.18*(1-k);ctx.beginPath();ctx.arc(0,0,(f.rad||35)*(1-k*.3),0,TAU);ctx.fill();}}ctx.restore();}
    for(const p of G.particles){const s=worldToScreen(p.x,p.y);ctx.save();ctx.globalAlpha=clamp(p.life*3,0,1);ctx.fillStyle=p.color;ctx.translate(s.x,s.y);ctx.rotate(p.rot||0);ctx.beginPath();if(p.shape==='splinter'){const len=p.len||p.r*2.5;ctx.moveTo(-len*.55,-p.r*.22);ctx.lineTo(len*.48,0);ctx.lineTo(-len*.28,p.r*.25);ctx.lineTo(-len*.66,p.r*.06);ctx.closePath();}else if(p.shape==='shard'){ctx.moveTo(-p.r*.75,-p.r*.35);ctx.lineTo(p.r,0);ctx.lineTo(-p.r*.55,p.r*.50);ctx.closePath();}else if(p.shape==='block'){ctx.rect(-p.r*.65,-p.r*.48,p.r*1.3,p.r*.96);}else ctx.arc(0,0,p.r,0,TAU);ctx.fill();ctx.restore();}ctx.globalAlpha=1;for(const n of G.numbers){const s=worldToScreen(n.x,n.y-n.t*44),alpha=clamp(n.life*2,0,1);ctx.globalAlpha=alpha;ctx.textAlign='center';if(n.bubble){const label=String(n.text);ctx.font='1000 23px system-ui';const bw=Math.max(52,ctx.measureText(label).width+24),bh=35;ctx.fillStyle='rgba(255,249,225,.98)';ctx.strokeStyle='#ff7b25';ctx.lineWidth=4;roundRect(ctx,s.x-bw/2,s.y-bh,bw,bh,12);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(s.x-6,s.y-bh+2);ctx.lineTo(s.x+6,s.y-bh+2);ctx.lineTo(s.x,s.y+2);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#d73d1f';ctx.lineWidth=2;ctx.strokeStyle='#fff7d8';ctx.strokeText(label,s.x,s.y-9);ctx.fillText(label,s.x,s.y-9);}else{ctx.font='1000 21px system-ui';ctx.lineWidth=5;ctx.strokeStyle='#152011';ctx.strokeText(n.text,s.x,s.y);ctx.fillStyle=n.color;ctx.fillText(n.text,s.x,s.y);}}ctx.globalAlpha=1;}
  function drawChargeWarn(){for(const b of G.enemies){if(b.dead||b.state!=='chargeWarn'||!b.charge)continue;const s=worldToScreen(b.charge.x,b.charge.y),half=b.midboss?42:58;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(b.charge.a);ctx.fillStyle=`rgba(255,44,35,${.17+Math.sin(clock*15)*.09})`;ctx.fillRect(0,-half,b.charge.len,half*2);ctx.strokeStyle='#ff3c32';ctx.lineWidth=4;ctx.setLineDash([22,14]);ctx.strokeRect(0,-half,b.charge.len,half*2);ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='900 30px system-ui';for(let x=70;x<b.charge.len;x+=120)ctx.fillText('➤',x,10);ctx.restore();}}
  function drawMinimap(){const size=Math.min(92,W*.22),x=10,y=topSafe+60,pad=7,inner=size-pad*2,sc=inner/WORLD,px=v=>x+pad+clamp(v,0,WORLD)*sc,py=v=>y+pad+clamp(v,0,WORLD)*sc;ctx.save();ctx.fillStyle='rgba(10,28,17,.78)';roundRect(ctx,x,y,size,size,12);ctx.fill();ctx.strokeStyle='rgba(244,225,143,.9)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='rgba(84,142,62,.35)';ctx.fillRect(x+pad,y+pad,inner,inner);for(const e of G.enemies){if(e.dead)continue;ctx.fillStyle=e.boss?'#d93cff':e.midboss?'#ff9d32':'#ff5750';ctx.beginPath();ctx.arc(px(e.x),py(e.y),e.boss?3.6:e.midboss?3:1.35,0,TAU);ctx.fill();}if(G.mode==='defense'||G.mode==='hunt'){ctx.save();ctx.translate(px(CORE.x),py(CORE.y));ctx.rotate(Math.PI/4);ctx.fillStyle='#ffe26b';ctx.fillRect(-3.5,-3.5,7,7);ctx.restore();}for(const a of G.allies){if(a.dead)continue;ctx.fillStyle='#55eaff';ctx.beginPath();ctx.arc(px(a.x),py(a.y),2.5,0,TAU);ctx.fill();}ctx.fillStyle='#ffffff';ctx.strokeStyle='#2584ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px(G.p.x),py(G.p.y),3.5,0,TAU);ctx.fill();ctx.stroke();const vw=W*sc,vh=H*sc;ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=1;ctx.strokeRect(px(cam.x)-vw/2,py(cam.y)-vh/2,vw,vh);ctx.restore();}
  function drawHUD(){const y=topSafe+7,w=Math.min(W-28,650),x=(W-w)/2,barW=w-105;ctx.fillStyle='rgba(18,31,23,.78)';roundRect(ctx,x,y,barW,25,12);ctx.fill();ctx.font='800 14px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';if(G.mode==='defense'||G.mode==='hunt'){ctx.fillStyle='#ffca57';roundRect(ctx,x+2,y+2,(barW-4)*clamp(CORE.hp/CORE.maxHp,0,1),21,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(`쿠키 ${Math.max(0,Math.ceil(CORE.hp))}/${CORE.maxHp}`,x+barW/2,y+18);}else{ctx.fillStyle='#6fe2ff';roundRect(ctx,x+2,y+2,(barW-4)*clamp(G.lives/5,0,1),21,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(`남은 목숨 ${G.lives}/5 · 무한 생존`,x+barW/2,y+18);}
    ctx.fillStyle='rgba(18,31,23,.84)';roundRect(ctx,x+w-96,y,58,34,13);ctx.fill();ctx.font='900 14px system-ui';ctx.fillStyle='#fff4a5';ctx.fillText(formatTime(G.time),x+w-67,y+22);roundRect(ctx,x+w-32,y,32,34,11);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+w-24,y+9,5,17);ctx.fillRect(x+w-14,y+9,5,17);
    const p=G.p;const hpY=y+36;ctx.fillStyle='#152719cc';roundRect(ctx,x,hpY,150,12,6);ctx.fill();ctx.fillStyle='#64db80';roundRect(ctx,x+1,hpY+1,148*clamp(p.hp/p.maxHp,0,1),10,5);ctx.fill();ctx.font='800 11px system-ui';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(`HP ${Math.max(0,Math.ceil(p.hp))}`,x+5,hpY+10);
    const major=G.boss&&!G.boss.dead?G.boss:G.rhino&&!G.rhino.dead?G.rhino:null;if(major){const bw=Math.min(W-40,520),bx=(W-bw)/2,by=topSafe+68;ctx.fillStyle='#28121b';roundRect(ctx,bx,by,bw,20,9);ctx.fill();ctx.fillStyle=major.midboss?'#ffbd35':'#8fe441';roundRect(ctx,bx+2,by+2,(bw-4)*clamp(major.hp/major.maxHp,0,1),16,7);ctx.fill();ctx.textAlign='center';ctx.font='900 13px system-ui';ctx.fillStyle='#fff';ctx.fillText(major.midboss?'폭주 태엽 코뿔소':'밀림의 뱀 대장',W/2,by+15);}
    const xpY=H-Math.max(8,bottomSafe*.45)-13;ctx.fillStyle='#14251bd9';roundRect(ctx,16,xpY,W-32,10,5);ctx.fill();ctx.fillStyle='#72e5ff';roundRect(ctx,17,xpY+1,(W-34)*clamp(p.xp/p.nextXp,0,1),8,4);ctx.fill();ctx.textAlign='center';ctx.font='900 12px system-ui';ctx.fillStyle='#fff';ctx.fillText(`Lv.${p.level}  ·  WAVE ${G.wave}`,W/2,xpY-4);
    drawMinimap();if(input.touch){ctx.globalAlpha=.5;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(input.ox,input.oy,54,0,TAU);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(input.ox+input.x*42,input.oy+input.y*42,22,0,TAU);ctx.fill();ctx.globalAlpha=1;}}
  function formatTime(t){const m=(t/60)|0,s=(t%60)|0;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
  function drawFighter(f,size=56,team=false){if(f.dead)return;const s=worldToScreen(f.x,f.y),w=f.weapons[0];drawToy(ctx,{...f,x:s.x,y:s.y,weapon:w.id,weaponLv:w.lv},size,false,clock);const gw=team?36:44,gy=s.y+size*.39,charge=1-clamp(w.cd/Math.max(.01,w.maxCd),0,1);ctx.fillStyle='#13231acc';roundRect(ctx,s.x-gw/2,gy,gw,5,3);ctx.fill();ctx.fillStyle=charge>=.99?'#fff078':'#75dcff';roundRect(ctx,s.x-gw/2+1,gy+1,(gw-2)*charge,3,2);ctx.fill();if(team){const bw=40,x=s.x-bw/2,y=s.y-size*.57;ctx.fillStyle='#173323cc';roundRect(ctx,x,y,bw,5,3);ctx.fill();ctx.fillStyle='#7bffb0';roundRect(ctx,x+1,y+1,(bw-2)*clamp(f.hp/f.maxHp,0,1),3,2);ctx.fill();ctx.font='800 8px system-ui';ctx.textAlign='center';ctx.fillStyle='#edfff2';ctx.fillText('AI',s.x,y-2);}}
  function draw(){drawMap();drawChests();drawChargeWarn();const sorted=G.enemies.filter(e=>!e.dead||e.deadT>0).sort((a,b)=>a.y-b.y);for(const e of sorted)drawEnemy(e);drawDrops();drawProjectiles();drawEnemyBullets();for(const a of G.allies)drawFighter(a,53,true);drawDirectionArrow(G.p);drawFighter(G.p,58,false);drawEffects();drawComicNumbers();drawHUD();}
  function endGame(win,reason='player'){if(state==='gameover')return;state='gameover';AudioMgr.engine(false);const p=G.p;$('#overTitle').textContent=win?`${MODES[G.mode].name} 성공!`:reason==='cookie'?'쿠키를 빼앗겼어요!':'장난감 원정대가 쓰러졌어요!';$('#overStats').innerHTML=statHtml(G.wave,'도달 웨이브')+statHtml(G.kills,'몬스터 처치')+statHtml(p.level,'레벨');showScreen('#gameover');}
  function loop(now){requestAnimationFrame(loop);const raw=(now-last)/1000;last=now;clock=now/1000;if(state==='play'&&G){const dt=Math.min(.033,raw);update(dt);draw();}else if(state==='pause'||state==='levelup'||state==='gameover'){if(G)draw();}}
  preload();requestAnimationFrame(loop);
  </script>
