<body>
  <canvas id="game"></canvas>
  <div id="loading"><div class="load-logo">TOY BATTLE</div><div class="load-track"><div id="loadFill"></div></div><p>장난감 원정대 준비 중…</p></div>
  <section id="home" class="screen show">
    <button id="startBtn" class="hotspot" aria-label="스타트">START</button>
    <div id="homeToast" class="home-toast">준비 중인 메뉴예요</div>
  </section>
  <section id="select" class="screen">
    <div class="select-panel">
      <button id="selectBack" class="back-btn" aria-label="뒤로가기">←</button>
      <div class="select-title">장난감 대원 선택</div>
      <canvas id="preview"></canvas>
      <div class="char-row"><button id="prevChar" class="round-btn">‹</button><div class="char-info"><div id="charName"></div><div id="charWeapon"></div></div><button id="nextChar" class="round-btn">›</button></div>
      <div id="charDesc" class="char-desc"></div>
      <div class="setup-block">
        <div class="select-line"><span class="setup-label">모드</span><button class="pick-arrow" data-pick="mode" data-step="-1">‹</button><div id="modeChoice" class="choice-box"></div><button class="pick-arrow" data-pick="mode" data-step="1">›</button></div>
        <div class="select-line"><span class="setup-label">난이도</span><button class="pick-arrow" data-pick="diff" data-step="-1">‹</button><div id="diffChoice" class="choice-box"></div><button class="pick-arrow" data-pick="diff" data-step="1">›</button></div>
        <div class="select-line"><span class="setup-label">무기</span><button class="pick-arrow" data-pick="weapon" data-step="-1">‹</button><div id="weaponChoice" class="choice-box"></div><button class="pick-arrow" data-pick="weapon" data-step="1">›</button></div>
      </div>
      <button id="playBtn" class="primary">쿠키를 지키러 출발!</button>
    </div>
  </section>
  <section id="stageselect" class="screen overlay"><div class="modal"><h2>스테이지 선택</h2><p>도전할 스테이지를 골라주세요.</p>
    <button id="stage1Btn" class="stage-card"><span class="stage-num">STAGE 1</span><span class="stage-name">🌴 정글 쿠키 수호</span><span class="stage-sub">정글맵 · 뱀 대장 보스</span></button>
    <button id="stage2Btn" class="stage-card"><span class="stage-num">STAGE 2</span><span class="stage-name">🏭 장난감 공장</span><span class="stage-sub">공장맵 · 태엽로봇 보스</span></button>
    <button id="stageBackBtn" class="menu-btn">← 뒤로</button>
  </div></section>
  <section id="pause" class="screen overlay"><div class="modal"><h2>일시정지</h2><p id="pauseModeText">밀림도 잠깐 숨을 고르고 있어요.</p><div id="pauseStats" class="stats"></div><div class="pause-section"><h3>획득 무기 · 아이템</h3><div id="pauseLoadout" class="detail-grid"></div></div><div class="pause-section"><h3>현재 능력치</h3><div id="pauseDetailStats" class="detail-grid"></div></div><div class="pause-section"><h3>사운드 설정</h3><label class="sound-row"><span>음악</span><input id="bgmVol" type="range" min="0" max="100" value="18"><output id="bgmOut">18</output></label><label class="sound-row"><span>효과음</span><input id="sfxVol" type="range" min="0" max="100" value="100"><output id="sfxOut">100</output></label></div><button id="resumeBtn" class="menu-btn accent">계속하기</button><button id="quitBtn" class="menu-btn">메인화면</button></div></section>
  <section id="levelup" class="screen overlay"><div class="modal"><h2>장난감 강화!</h2><p>새 장비를 고르거나 가진 장비를 강화하세요.</p><div id="upgradeGrid" class="upgrade-grid"></div></div></section>
  <section id="gameover" class="screen overlay"><div class="modal"><h2 id="overTitle">쿠키를 빼앗겼어요!</h2><div id="overStats" class="stats"></div><button id="againBtn" class="menu-btn accent">다시 도전</button><button id="overHomeBtn" class="menu-btn">메인화면</button></div></section>
  <div id="toast"></div>
  <script src="assets/data.js?v=12"></script>

  function resize(){
    const vv=window.visualViewport;
    DPR=Math.min(devicePixelRatio||1,1.35);topSafe=standalone?Math.max(48,envSafeTop()):12;bottomSafe=standalone?Math.max(34,envSafeBottom()):10;
    const root=document.documentElement;root.style.setProperty('--safe-top',topSafe+'px');root.style.setProperty('--safe-bottom',bottomSafe+'px');
    /* 레이아웃 뷰포트와 시각 뷰포트가 어긋나면(사파리 확대/축소 상태 등) fixed 요소가 밀려 보인다 — 오프셋만큼 되돌려준다 */
    const offX=vv?vv.offsetLeft:0, offY=vv?vv.offsetTop:0;
    root.style.transform=(offX||offY)?`translate(${-offX}px,${-offY}px)`:'none';
    /* 화면 크기는 CSS 100dvh가 스스로 맞춘다(사파리 주소창이 나타나거나 사라져도 항상 꽉 참) —
       여기서는 실제로 렌더된 크기를 그대로 읽어서 캔버스 해상도만 맞춰준다. px 고정값을 강제하지 않는다. */
    const r=canvas.getBoundingClientRect();
    W=Math.ceil(Math.max(1,r.width));H=Math.ceil(Math.max(1,r.height));
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
    const pr=preview.getBoundingClientRect();preview.width=Math.max(1,Math.round(pr.width*DPR));preview.height=Math.max(1,Math.round(pr.height*DPR));pctx.setTransform(DPR,0,0,DPR,0,0);
  }

    Object.values(DATA.characters).forEach(c=>{out.add(c.smile);Object.values(c.directions).forEach(d=>out.add(d.file));});
    Object.values(DATA.v2characters||{}).forEach(c=>{out.add(c.portrait);c.frames.forEach(p=>out.add(p));});
    Object.values(DATA.portraits||{}).forEach(p=>out.add(p));
    Object.values(DATA.v2mobs||{}).forEach(v=>Array.isArray(v)?v.forEach(p=>out.add(p)):out.add(v));
    Object.values(DATA.stage2mobs||{}).forEach(p=>out.add(p));
    (DATA.boomerangFx||[]).forEach(p=>out.add(p));
    const up=DATA.update||{};(up.snake||[]).forEach(p=>out.add(p));Object.values(up.death||{}).forEach(a=>a.forEach(p=>out.add(p)));(up.spearFx||[]).forEach(p=>out.add(p));(up.swordFx||[]).forEach(p=>out.add(p));(up.top||[]).forEach(p=>out.add(p));['helicopter','missile'].forEach(k=>up[k]&&out.add(up[k]));

  /* 흰색 배경만 테두리에서부터 flood-fill로 제거 — 내용물이 밝은 색이어도(칼날 등) 검은 윤곽선 안쪽이면 보존된다 */
  function stripLightBg(img){
    const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
    const g=c.getContext('2d'); g.drawImage(img,0,0);
    const id=g.getImageData(0,0,c.width,c.height), d=id.data, w=c.width, h=c.height;
    function isBg(i4){ const r=d[i4],gg=d[i4+1],b=d[i4+2]; const low=Math.min(r,gg,b), high=Math.max(r,gg,b); return low>=205 && (high-low)<=20; }
    const visited=new Uint8Array(w*h);
    const stack=[];
    function idx(x,y){return y*w+x;}
    for(let x=0;x<w;x++){ for(const y of [0,h-1]){ const i=idx(x,y); if(!visited[i] && isBg(i*4)) stack.push(i); } }
    for(let y=0;y<h;y++){ for(const x of [0,w-1]){ const i=idx(x,y); if(!visited[i] && isBg(i*4)) stack.push(i); } }
    while(stack.length){
      const i=stack.pop();
      if(visited[i]) continue;
      if(!isBg(i*4)) continue;
      visited[i]=1; d[i*4+3]=0;
      const x=i%w, y=(i/w)|0;
      if(x>0) stack.push(i-1); if(x<w-1) stack.push(i+1); if(y>0) stack.push(i-w); if(y<h-1) stack.push(i+w);
    }
    g.putImageData(id,0,0);
    return c;
  }

  function updateSpecialWeapons(dt){
    const p=G.p;
    if(p.flags.top&&p.carT<=0){
      const topMaxed=(p.items.top_duration||0)>=4;
      if(topMaxed){p.topActive=9999;p.topRest=0;}
      else{p.topRest=(p.topRest??.15)-dt;if((p.topActive||0)>0)p.topActive-=dt;else if(p.topRest<=0){p.topActive=3.15*(p.topDuration||1);p.topRest=p.topActive+1.8;}}
      if(p.topActive>0){const count=p.topCount||1,total=topMaxed?1:3.15*(p.topDuration||1),fade=topMaxed?1:Math.min(1,(total-p.topActive)*3.5,p.topActive*3.5),radius=82+38*fade;for(let j=0;j<count;j++){const a=G.time*3.5+j*TAU/count,x=p.x+Math.cos(a)*radius,y=p.y+Math.sin(a)*radius;for(const e of G.enemies){if(e.dead||Math.hypot(e.x-x,e.y-y)>e.r+18)continue;const key='topHit'+j;if(G.time-(e[key]||-9)<.28)continue;e[key]=G.time;hitEnemy(e,24*(p.topPower||1),a,170,'#ffd744',false);}}}

      if(points.length&&p.heliShot<=0){p.heliShot=2.65*(p.heliCd||1);const count=Math.min(8,3+((p.heliVolley++||0)%2)+(p.heliExtra||0));for(const q of points)G.effects.push({type:'missileTarget',x:q.x,y:q.y,rad:25,t:0,life:.82,color:'#5dff4f'});for(let j=0;j<count;j++){const q=points[j%points.length],z=rollDamage(p,26*(p.heliPower||1)),a=Math.atan2(q.y-hp.y,q.x-hp.x);G.missiles.push({owner:p,x:hp.x,y:hp.y,a:a+(j%2?-.035:.035),speed:390,life:2.5,delay:j*.105,target:q.target,offX:q.offX,offY:q.offY,tx:q.x,ty:q.y,dmg:z.value,crit:z.crit,smoke:0,idx:j});}}
    }

  function spawnPoint(){
    const pl=G.p;
    const ring=Math.max(W,H)*0.62;
    const minAway=Math.hypot(W,H)*0.55;
    for(let i=0;i<26;i++){
      const roll=Math.random(); let x,y;
      if(roll<0.38){                          // ① 플레이어 주변 링
        const a=Math.random()*TAU, rad=ring+rnd(220,40);
        x=pl.x+Math.cos(a)*rad; y=pl.y+Math.sin(a)*rad;
      } else if(roll<0.54){                    // ② 쿠키 주변
        const a=Math.random()*TAU, rad=CORE.r*4+rnd(440,0);
        x=CORE.x+Math.cos(a)*rad; y=CORE.y+Math.sin(a)*rad;
      } else if(roll<0.72){                    // ③ 맵 아무데나 (강 건너편 포함 — 다리로 넘어온다)
        x=rnd(WORLD-60,60); y=rnd(WORLD-60,60);
      } else if(roll<0.87){                    // ④ 맵 가장자리
        const e=(Math.random()*4)|0, m=rnd(170,50);
        if(e===0){ x=rnd(WORLD-50,50); y=m; }
        else if(e===1){ x=rnd(WORLD-50,50); y=WORLD-m; }
        else if(e===2){ x=m; y=rnd(WORLD-50,50); }
        else { x=WORLD-m; y=rnd(WORLD-50,50); }
      } else {                                 // ⑤ 무리 스폰 — 몇 초간 한 지점에 뭉쳐 나온다
        if(!G._cluster || G.time>G._clusterT){
          const a=Math.random()*TAU, rad=ring+rnd(420,60);
          G._cluster={x:clamp(pl.x+Math.cos(a)*rad,70,WORLD-70), y:clamp(pl.y+Math.sin(a)*rad,70,WORLD-70)};
          G._clusterT=G.time+6;
        }
        x=G._cluster.x+rnd(95,-95); y=G._cluster.y+rnd(95,-95);
      }
      x=clamp(x,50,WORLD-50); y=clamp(y,50,WORLD-50);
      if(Math.hypot(x-pl.x,y-pl.y)<minAway) continue;
      if(inWater(x,y,40)) continue;
      if(blockedAt(x,y,34)) continue;
      return {x,y};
    }
    const a=Math.random()*TAU, rad=ring+rnd(180,40);   // 26번 실패하면 예전 방식으로
    return pushOutOfWater({x:clamp(pl.x+Math.cos(a)*rad,40,WORLD-40),y:clamp(pl.y+Math.sin(a)*rad,40,WORLD-40)},40);
  }

        ctx.translate(s.x,s.y);const rad=f.rad||42;ctx.rotate(k*.22);ctx.lineCap='round';for(let j=0;j<9;j++){ctx.save();ctx.rotate(j*TAU/9);ctx.strokeStyle=j%2?'#fff8cf':f.color;ctx.lineWidth=(j%2?3:6)*(1-k);ctx.beginPath();ctx.moveTo(rad*(.12+k*.18),0);ctx.lineTo(rad*(.72+k*.45),0);ctx.stroke();ctx.restore();}ctx.rotate(-k*.45);ctx.strokeStyle='#fff';ctx.lineWidth=5*(1-k);ctx.beginPath();ctx.moveTo(-rad*.62,0);ctx.lineTo(rad*.62,0);ctx.moveTo(0,-rad*.62);ctx.lineTo(0,rad*.62);ctx.stroke();
      }else if(f.type==='hit'){
        ctx.translate(s.x,s.y);ctx.rotate(f.a);ctx.strokeStyle=f.color;ctx.lineWidth=5;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-10,i*7);ctx.lineTo(16,i*10);ctx.stroke();}
      }else{
        ctx.translate(s.x,s.y);ctx.strokeStyle=f.color;ctx.lineWidth=8*(1-k);ctx.beginPath();ctx.arc(0,0,(f.rad||35)*(.35+k*.9),0,TAU);ctx.stroke();if(f.type==='death'||f.type==='teamSpawn'){ctx.fillStyle=f.color;ctx.globalAlpha=.18*(1-k);ctx.beginPath();ctx.arc(0,0,(f.rad||35)*(1-k*.3),0,TAU);ctx.fill();}
      }
      ctx.restore();
    }
    for(const p of G.particles){const s=worldToScreen(p.x,p.y);ctx.save();ctx.globalAlpha=clamp(p.life*3,0,1);ctx.fillStyle=p.color;ctx.translate(s.x,s.y);ctx.rotate(p.rot||0);ctx.beginPath();if(p.shape==='splinter'){const len=p.len||p.r*2.5;ctx.moveTo(-len*.55,-p.r*.22);ctx.lineTo(len*.48,0);ctx.lineTo(-len*.28,p.r*.25);ctx.lineTo(-len*.66,p.r*.06);ctx.closePath();}else if(p.shape==='shard'){ctx.moveTo(-p.r*.75,-p.r*.35);ctx.lineTo(p.r,0);ctx.lineTo(-p.r*.55,p.r*.50);ctx.closePath();}else if(p.shape==='block'){ctx.rect(-p.r*.65,-p.r*.48,p.r*1.3,p.r*.96);}else ctx.arc(0,0,p.r,0,TAU);ctx.fill();ctx.restore();}ctx.globalAlpha=1;for(const n of G.numbers){const pop=clamp(n.t/.16,0,1),ease=1-Math.pow(1-pop,3),rise=ease*30+Math.min(n.t,n.life)*50,s=worldToScreen(n.x+(n.dx||0)*ease,n.y-rise),alpha=clamp(n.life*2,0,1),bounceScale=1+Math.max(0,.6-n.t*3.6);ctx.globalAlpha=alpha;ctx.textAlign='center';if(n.bubble){const label=String(n.text);ctx.font='1000 23px system-ui';const bw=Math.max(52,ctx.measureText(label).width+24),bh=35;ctx.fillStyle='rgba(255,249,225,.98)';ctx.strokeStyle='#ff7b25';ctx.lineWidth=4;roundRect(ctx,s.x-bw/2,s.y-bh,bw,bh,12);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(s.x-6,s.y-bh+2);ctx.lineTo(s.x+6,s.y-bh+2);ctx.lineTo(s.x,s.y+2);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#d73d1f';ctx.lineWidth=2;ctx.strokeStyle='#fff7d8';ctx.strokeText(label,s.x,s.y-9);ctx.fillText(label,s.x,s.y-9);}else{ctx.save();ctx.translate(s.x,s.y);ctx.scale(bounceScale,bounceScale);ctx.font='1000 21px system-ui';ctx.lineWidth=5;ctx.strokeStyle='#152011';ctx.strokeText(n.text,0,0);ctx.fillStyle=n.color;ctx.fillText(n.text,0,0);ctx.restore();}}ctx.globalAlpha=1;}
  function drawChargeWarn(){for(const b of G.enemies){if(b.dead||b.state!=='chargeWarn'||!b.charge)continue;const s=worldToScreen(b.charge.x,b.charge.y),half=b.midboss?42:58;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(b.charge.a);ctx.fillStyle=`rgba(255,44,35,${.17+Math.sin(clock*15)*.09})`;ctx.fillRect(0,-half,b.charge.len,half*2);ctx.strokeStyle='#ff3c32';ctx.lineWidth=4;ctx.setLineDash([22,14]);ctx.strokeRect(0,-half,b.charge.len,half*2);ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='900 30px system-ui';for(let x=70;x<b.charge.len;x+=120)ctx.fillText('➤',x,10);ctx.restore();}}
  function drawRobotBossHud(){for(const b of G.enemies){if(b.dead||b.type!=='robotboss')continue;const s=worldToScreen(b.x,b.y-b.r*3.4);
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(b.gearSpin||0);ctx.fillStyle='#c9902f';ctx.strokeStyle='#6b430f';ctx.lineWidth=2;for(let j=0;j<6;j++){ctx.save();ctx.rotate(j*TAU/6);ctx.fillRect(9,-4.5,9,9);ctx.restore();}ctx.beginPath();ctx.arc(0,0,13,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='#3a2408';ctx.beginPath();ctx.arc(0,0,5,0,TAU);ctx.fill();ctx.restore();
      if(b.state==='shockWarn'){const left=Math.max(0,b.stateT),k=left/3.0;ctx.save();ctx.translate(s.x,s.y-30);ctx.strokeStyle='rgba(30,20,10,.5)';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,17,0,TAU);ctx.stroke();ctx.strokeStyle='#8fd4ff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,17,-Math.PI/2,-Math.PI/2+k*TAU);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(Math.ceil(left).toString(),0,1);ctx.restore();}
    }}
  function drawMinimap(){const size=Math.min(92,W*.22),x=10,y=topSafe+60,pad=7,inner=size-pad*2,sc=inner/WORLD,px=v=>x+pad+clamp(v,0,WORLD)*sc,py=v=>y+pad+clamp(v,0,WORLD)*sc;ctx.save();ctx.fillStyle='rgba(10,28,17,.78)';roundRect(ctx,x,y,size,size,12);ctx.fill();ctx.strokeStyle='rgba(244,225,143,.9)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='rgba(84,142,62,.35)';ctx.fillRect(x+pad,y+pad,inner,inner);if(riverActive&&RIVER.segs.length){ctx.save();ctx.beginPath();roundRect(ctx,x+pad,y+pad,inner,inner);ctx.clip();ctx.strokeStyle='#2e9fe0';ctx.lineWidth=Math.max(2,RIVER.w*2*sc);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();RIVER.pts.forEach((p,i)=>i?ctx.lineTo(px(p[0]),py(p[1])):ctx.moveTo(px(p[0]),py(p[1])));ctx.stroke();ctx.fillStyle='#ffd166';for(const b of RIVER.bridges)ctx.fillRect(px(b.x)-3,py(b.y)-3,6,6);ctx.restore();}for(const e of G.enemies){if(e.dead)continue;ctx.fillStyle=e.boss?'#d93cff':e.midboss?'#ff9d32':'#ff5750';ctx.beginPath();ctx.arc(px(e.x),py(e.y),e.boss?3.6:e.midboss?3:1.35,0,TAU);ctx.fill();}if(G.mode==='defense'||G.mode==='hunt'){ctx.save();ctx.translate(px(CORE.x),py(CORE.y));ctx.rotate(Math.PI/4);ctx.fillStyle='#ffe26b';ctx.fillRect(-3.5,-3.5,7,7);ctx.restore();}for(const a of G.allies){if(a.dead)continue;ctx.fillStyle='#55eaff';ctx.beginPath();ctx.arc(px(a.x),py(a.y),2.5,0,TAU);ctx.fill();}ctx.fillStyle='#ffffff';ctx.strokeStyle='#2584ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px(G.p.x),py(G.p.y),3.5,0,TAU);ctx.fill();ctx.stroke();const vw=W*sc,vh=H*sc;ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=1;ctx.strokeRect(px(cam.x)-vw/2,py(cam.y)-vh/2,vw,vh);ctx.restore();}
  function drawHUD(){const y=topSafe+7,w=Math.min(W-28,650),x=(W-w)/2,barW=w-105;ctx.fillStyle='rgba(18,31,23,.78)';roundRect(ctx,x,y,barW,25,12);ctx.fill();ctx.font='800 14px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';if(G.mode==='defense'||G.mode==='hunt'){ctx.fillStyle='#ffca57';roundRect(ctx,x+2,y+2,(barW-4)*clamp(CORE.hp/CORE.maxHp,0,1),21,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(`쿠키 ${Math.max(0,Math.ceil(CORE.hp))}/${CORE.maxHp}`,x+barW/2,y+18);}else{ctx.fillStyle='#6fe2ff';roundRect(ctx,x+2,y+2,(barW-4)*clamp(G.lives/5,0,1),21,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(`남은 목숨 ${G.lives}/5 · 무한 생존`,x+barW/2,y+18);}
    ctx.fillStyle='rgba(18,31,23,.84)';roundRect(ctx,x+w-96,y,58,34,13);ctx.fill();ctx.font='900 14px system-ui';ctx.fillStyle='#fff4a5';ctx.fillText(formatTime(G.time),x+w-67,y+22);roundRect(ctx,x+w-32,y,32,34,11);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+w-24,y+9,5,17);ctx.fillRect(x+w-14,y+9,5,17);
    const p=G.p;const hpY=y+36;ctx.fillStyle='#152719cc';roundRect(ctx,x,hpY,150,12,6);ctx.fill();ctx.fillStyle='#64db80';roundRect(ctx,x+1,hpY+1,148*clamp(p.hp/p.maxHp,0,1),10,5);ctx.fill();ctx.font='800 11px system-ui';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(`HP ${Math.max(0,Math.ceil(p.hp))}`,x+5,hpY+10);
    const major=G.boss&&!G.boss.dead?G.boss:G.rhino&&!G.rhino.dead?G.rhino:null;if(major){const bw=Math.min(W-40,520),bx=(W-bw)/2,by=topSafe+68;ctx.fillStyle='#28121b';roundRect(ctx,bx,by,bw,20,9);ctx.fill();ctx.fillStyle=major.midboss?'#ffbd35':'#8fe441';roundRect(ctx,bx+2,by+2,(bw-4)*clamp(major.hp/major.maxHp,0,1),16,7);ctx.fill();ctx.textAlign='center';ctx.font='900 13px system-ui';ctx.fillStyle='#fff';ctx.fillText(major.midboss?'폭주 태엽 코뿔소':'밀림의 뱀 대장',W/2,by+15);}
    const xpY=H-Math.max(8,bottomSafe*.45)-13;ctx.fillStyle='#14251bd9';roundRect(ctx,16,xpY,W-32,10,5);ctx.fill();ctx.fillStyle='#72e5ff';roundRect(ctx,17,xpY+1,(W-34)*clamp(p.xp/p.nextXp,0,1),8,4);ctx.fill();ctx.textAlign='center';ctx.font='900 12px system-ui';ctx.fillStyle='#fff';ctx.fillText(`Lv.${p.level}  ·  WAVE ${G.wave}`,W/2,xpY-4);
    drawMinimap();if(input.touch){ctx.globalAlpha=.5;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(input.ox,input.oy,54,0,TAU);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(input.ox+input.x*42,input.oy+input.y*42,22,0,TAU);ctx.fill();ctx.globalAlpha=1;}}
  function formatTime(t){const m=(t/60)|0,s=(t%60)|0;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
  function drawFighter(f,size=56,team=false){if(f.dead)return;const s=worldToScreen(f.x,f.y),w=f.weapons[0];drawToy(ctx,{...f,x:s.x,y:s.y,weapon:w.id,weaponLv:w.lv},size,false,clock);const gw=team?36:44,gy=s.y+size*.39,charge=1-clamp(w.cd/Math.max(.01,w.maxCd),0,1);ctx.fillStyle='#13231acc';roundRect(ctx,s.x-gw/2,gy,gw,5,3);ctx.fill();ctx.fillStyle=charge>=.99?'#fff078':'#75dcff';roundRect(ctx,s.x-gw/2+1,gy+1,(gw-2)*charge,3,2);ctx.fill();if(team){const bw=40,x=s.x-bw/2,y=s.y-size*.57;ctx.fillStyle='#173323cc';roundRect(ctx,x,y,bw,5,3);ctx.fill();ctx.fillStyle='#7bffb0';roundRect(ctx,x+1,y+1,(bw-2)*clamp(f.hp/f.maxHp,0,1),3,2);ctx.fill();ctx.font='800 8px system-ui';ctx.textAlign='center';ctx.fillStyle='#edfff2';ctx.fillText('AI',s.x,y-2);}}
  function draw(){drawMap();drawChests();drawChargeWarn();drawRobotBossHud();const sorted=G.enemies.filter(e=>!e.dead||e.deadT>0).sort((a,b)=>a.y-b.y);for(const e of sorted)drawEnemy(e);drawDrops();drawProjectiles();drawSpecialWeapons();drawEnemyBullets();for(const a of G.allies)drawFighter(a,45,true);drawDirectionArrow(G.p);drawFighter(G.p,49,false);drawSpearEffects();drawEffects();drawComicNumbers();drawHUD();}
  function endGame(win,reason='player'){if(state==='gameover')return;state='gameover';AudioMgr.engine(false);const p=G.p;$('#overTitle').textContent=win?`${MODES[G.mode].name} 성공!`:reason==='cookie'?'쿠키를 빼앗겼어요!':'장난감 원정대가 쓰러졌어요!';$('#overStats').innerHTML=statHtml(G.wave,'도달 웨이브')+statHtml(G.kills,'몬스터 처치')+statHtml(p.level,'레벨');showScreen('#gameover');}
  function loop(now){requestAnimationFrame(loop);const raw=(now-last)/1000;last=now;clock=now/1000;if(state==='play'&&G){const dt=Math.min(.033,raw);update(dt);draw();}else if(state==='pause'||state==='levelup'||state==='gameover'){if(G)draw();}}
  preload();requestAnimationFrame(loop);
  </script>
