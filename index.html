<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#183d20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="토이 배틀">
  <link rel="apple-touch-icon" href="assets/ui/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <title>TOY BATTLE</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#15351c;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none}
    canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;background:#294f24}
    .screen{position:fixed;inset:0;display:none;z-index:20}
    .screen.show{display:flex}
    #loading{display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(#4ec0ff,#6bc249);font-weight:900;letter-spacing:.08em;z-index:80}
    #loading.hide{display:none}
    .load-logo{font-size:clamp(38px,10vw,72px);text-shadow:0 5px 0 #25304d;margin-bottom:25px;color:#fff06b}
    .load-track{width:min(70vw,360px);height:16px;background:#173542;border:3px solid #fff;border-radius:99px;overflow:hidden;box-shadow:0 4px 0 #16222b}
    #loadFill{height:100%;width:0;background:linear-gradient(90deg,#ffd631,#ff7d3c);transition:width .15s}
    #home{background:url('assets/ui/main.webp') center/100% 100% no-repeat;align-items:stretch;justify-content:center;background-color:#244d33}
    #home:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 76%,rgba(3,10,25,.22))}
    .hotspot{position:absolute;border:0;background:transparent;color:transparent;z-index:3;cursor:pointer}
    #startBtn{left:16%;right:16%;bottom:18.5%;height:11.5%;border-radius:35px}
    #startBtn:active{background:rgba(255,255,255,.18)}
    .home-toast{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);padding:10px 18px;border-radius:22px;background:rgba(22,36,52,.87);font-weight:800;opacity:0;transition:.2s;z-index:5;white-space:nowrap}
    .home-toast.on{opacity:1}
    #select{align-items:center;justify-content:center;background:linear-gradient(rgba(11,31,20,.72),rgba(10,24,17,.9)),url('assets/ui/main.webp') center/cover no-repeat;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px)}
    .select-panel{width:min(94vw,520px);height:min(94dvh,850px);overflow:auto;border:3px solid #ffe69a;border-radius:30px;background:linear-gradient(160deg,rgba(49,96,50,.96),rgba(17,48,34,.98));box-shadow:0 14px 45px #07180f,inset 0 0 28px #6dbf6a55;display:flex;flex-direction:column;align-items:center;padding:14px 16px;position:relative}
    .select-title{font-weight:1000;font-size:clamp(23px,6vw,34px);color:#fff3a5;text-shadow:0 3px #684b1e}
    #preview{position:relative!important;inset:auto!important;width:min(72vw,390px)!important;height:min(38vh,340px)!important;min-height:170px;background:radial-gradient(circle at 50% 70%,#a9dc6c44,transparent 60%);flex:1}
    .char-row{display:flex;align-items:center;gap:18px;width:100%;justify-content:center}
    .round-btn{width:54px;height:54px;border-radius:50%;border:3px solid #fff2ad;background:#2a6946;color:#fff;font-size:28px;font-weight:1000;box-shadow:0 5px 0 #123b28}
    .round-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #123b28}
    .char-info{text-align:center;min-width:190px}
    #charName{font-size:28px;font-weight:1000;color:#fff5a6}
    #charWeapon{margin-top:4px;font-weight:800;color:#d7ffe0}
    .char-desc{font-size:13px;opacity:.86;margin:5px 0 8px;text-align:center;min-height:36px}
    .setup-block{width:100%;display:grid;gap:7px;margin:2px 0 10px}.setup-line{display:grid;grid-template-columns:54px 1fr;gap:7px;align-items:center}.setup-label{font-size:12px;font-weight:900;color:#fff3aa;text-align:left}.chip-row{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.setup-chip{border:1px solid #80c98c;border-radius:10px;background:#153b2b;color:#dff7e4;padding:7px 3px;font-weight:900;font-size:12px}.setup-chip.active{background:#ffbe3c;border-color:#fff0a4;color:#39240d;box-shadow:inset 0 -2px #d97024}
    .primary{border:3px solid #fff0ac;background:linear-gradient(#ffca42,#f07825);color:#3a2108;border-radius:22px;padding:14px 45px;font-size:24px;font-weight:1000;box-shadow:0 7px 0 #803b17;text-shadow:0 1px #fff9;min-width:70%}
    .primary:active{transform:translateY(4px);box-shadow:0 3px 0 #803b17}
    .overlay{align-items:center;justify-content:center;background:rgba(7,18,14,.78);backdrop-filter:blur(5px);padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);z-index:50}
    .modal{width:min(92vw,560px);max-height:90dvh;overflow:auto;border:2px solid #ffe89d;border-radius:26px;background:linear-gradient(160deg,#264f35,#102d22);box-shadow:0 16px 55px #000c;padding:22px;text-align:center}
    .modal h2{font-size:34px;margin:0 0 6px;color:#fff1a1}.modal p{opacity:.82}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}
    .stat{background:#0b271dbb;border:1px solid #6abf7a;border-radius:14px;padding:12px 4px}.stat b{display:block;font-size:22px;color:#fff1a1}.stat span{font-size:12px;opacity:.75}
    .menu-btn{width:100%;margin-top:10px;padding:15px;border-radius:17px;border:2px solid #75b985;background:#173d2d;color:#fff;font-size:19px;font-weight:900}
    .menu-btn.accent{background:linear-gradient(#ffcf47,#ed8125);border-color:#fff1ad;color:#36210c}
    .upgrade-grid{display:grid;gap:11px;margin-top:16px}
    .upgrade{border:2px solid #90d091;border-radius:18px;background:linear-gradient(135deg,#1d4932,#0f3026);color:#fff;padding:14px;text-align:left;display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center}
    .upgrade img{width:54px;height:54px;object-fit:contain}.upgrade b{font-size:19px;color:#fff2a3}.upgrade small{display:block;margin-top:3px;opacity:.8;line-height:1.35}
    .upgrade-icon{width:54px;height:54px;border-radius:15px;background:#315d46;display:grid;place-items:center;font-size:30px;border:2px solid #91d39d}
    .pause-section{margin:12px 0;padding:12px;border:1px solid #71b77c;border-radius:15px;background:#0b261cbc;text-align:left}.pause-section h3{margin:0 0 8px;color:#fff1a1;font-size:16px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:13px}.detail-row{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:9px;background:#163a2aaa}.detail-row b{color:#fff0a2}.sound-row{display:grid;grid-template-columns:48px 1fr 38px;align-items:center;gap:7px;margin:9px 0}.sound-row input{width:100%;accent-color:#ffbd3c}.sound-row output{text-align:right;color:#fff1a1;font-weight:900}
    #toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-12px);z-index:70;background:rgba(24,42,20,.93);border:2px solid #ffd861;border-radius:20px;padding:12px 20px;font-weight:1000;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
    #toast.on{opacity:1;transform:translate(-50%,0)}
    @media (min-aspect-ratio:3/4){#home{background-size:100% 100%}.select-panel{height:min(96dvh,800px)}#preview{height:min(34vh,300px)!important}}
    @media (max-height:700px){.select-panel{padding:9px 12px}.select-title{font-size:21px}#preview{min-height:135px!important}.char-desc{display:none}.primary{padding:10px 32px;font-size:20px}.setup-chip{padding:5px 2px}}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading"><div class="load-logo">TOY BATTLE</div><div class="load-track"><div id="loadFill"></div></div><p>장난감 원정대 준비 중…</p></div>
  <section id="home" class="screen show">
    <button id="startBtn" class="hotspot" aria-label="스타트">START</button>
    <div id="homeToast" class="home-toast">준비 중인 메뉴예요</div>
  </section>
  <section id="select" class="screen">
    <div class="select-panel">
      <div class="select-title">장난감 대원 선택</div>
      <canvas id="preview"></canvas>
      <div class="char-row"><button id="prevChar" class="round-btn">‹</button><div class="char-info"><div id="charName"></div><div id="charWeapon"></div></div><button id="nextChar" class="round-btn">›</button></div>
      <div id="charDesc" class="char-desc"></div>
      <div class="setup-block">
        <div class="setup-line"><span class="setup-label">모드</span><div class="chip-row"><button class="setup-chip mode-chip active" data-mode="defense">과자 수비</button><button class="setup-chip mode-chip" data-mode="survival">생존전</button><button class="setup-chip mode-chip" data-mode="hunt">사냥전</button></div></div>
        <div class="setup-line"><span class="setup-label">난이도</span><div class="chip-row"><button class="setup-chip diff-chip" data-diff="easy">쉬움</button><button class="setup-chip diff-chip active" data-diff="normal">보통</button><button class="setup-chip diff-chip" data-diff="hard">어려움</button></div></div>
      </div>
      <button id="playBtn" class="primary">과자를 지키러 출발!</button>
    </div>
  </section>
  <section id="pause" class="screen overlay"><div class="modal"><h2>일시정지</h2><p id="pauseModeText">밀림도 잠깐 숨을 고르고 있어요.</p><div id="pauseStats" class="stats"></div><div class="pause-section"><h3>획득 무기 · 아이템</h3><div id="pauseLoadout" class="detail-grid"></div></div><div class="pause-section"><h3>현재 능력치</h3><div id="pauseDetailStats" class="detail-grid"></div></div><div class="pause-section"><h3>사운드 설정</h3><label class="sound-row"><span>음악</span><input id="bgmVol" type="range" min="0" max="100" value="32"><output id="bgmOut">32</output></label><label class="sound-row"><span>효과음</span><input id="sfxVol" type="range" min="0" max="100" value="36"><output id="sfxOut">36</output></label></div><button id="resumeBtn" class="menu-btn accent">계속하기</button><button id="quitBtn" class="menu-btn">메인화면</button></div></section>
  <section id="levelup" class="screen overlay"><div class="modal"><h2>장난감 강화!</h2><p>새 장비를 고르거나 가진 장비를 강화하세요.</p><div id="upgradeGrid" class="upgrade-grid"></div></div></section>
  <section id="gameover" class="screen overlay"><div class="modal"><h2 id="overTitle">과자를 빼앗겼어요!</h2><div id="overStats" class="stats"></div><button id="againBtn" class="menu-btn accent">다시 도전</button><button id="overHomeBtn" class="menu-btn">메인화면</button></div></section>
  <div id="toast"></div>
  <script src="assets/data.js"></script>
  <script>
  'use strict';
  const $=s=>document.querySelector(s), TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a=1,b=0)=>b+Math.random()*(a-b), pick=a=>a[(Math.random()*a.length)|0];
  const canvas=$('#game'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true}),preview=$('#preview'),pctx=preview.getContext('2d');
  const DATA=window.TOY_DATA, IMG={}, WORLD=3000, CORE={x:1500,y:1500,r:66,maxHp:2800,hp:2800};
  let W=innerWidth,H=innerHeight,DPR=1,topSafe=12,bottomSafe=10,state='loading',last=performance.now(),clock=0,selected=0,cam={x:1500,y:1500},shake=0,shakeX=0,shakeY=0;
  let G=null,loadDone=false,previewRAF=0,toastTimer=0,selectedMode='defense',selectedDiff='normal';
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const CHAR_ORDER=['windup_soldier','plush_cat','wooden_puppet','rubber_duck','paper_robot','clown_doll','toy_knight'];
  const CHARS={
    windup_soldier:{name:'태엽 병정',weapon:'nerf',weaponName:'연사 너프건',desc:'규칙에 엄격하지만 과자 앞에서는 누구보다 든든한 대장.'},
    plush_cat:{name:'봉제 고양이',weapon:'sword',weaponName:'장난감 칼',desc:'조용하고 재빠르며 친구의 실밥 하나까지 챙기는 검객.'},
    wooden_puppet:{name:'나무 인형',weapon:'spring',weaponName:'스프링 펀치',desc:'느긋해 보여도 한 번 주먹을 뻗으면 끝까지 해내는 장난꾸러기.'},
    rubber_duck:{name:'고무 오리',weapon:'water',weaponName:'고압 물총',desc:'시끄럽고 명랑한 물놀이 대장. 위험할수록 더 크게 꽥꽥댄다.'},
    paper_robot:{name:'종이 로봇',weapon:'bubble',weaponName:'비눗방울 총',desc:'계산은 빠르고 몸은 가볍다. 방울 전술을 가장 좋아한다.'},
    clown_doll:{name:'광대 인형',weapon:'spear',weaponName:'팝업 창',desc:'전장을 공연장처럼 누비며 긴 창으로 길을 여는 분위기 담당.'},
    toy_knight:{name:'장난감 기사',weapon:'hammer',weaponName:'수호 해머',desc:'과자 왕국의 명예를 지키는 정직하고 묵직한 수호자.'}
  };
  const WEAPONS={
    nerf:{name:'연사 너프건',desc:'빠른 주황색 폼 탄환을 연속 발사합니다.',size:42,cd:.145,range:590,color:'#ff9a2e'},
    water:{name:'고압 물총',desc:'적을 관통하는 시원한 물줄기를 발사합니다.',size:45,cd:1.05,range:620,color:'#4edcff'},
    bubble:{name:'비눗방울 총',desc:'강화할수록 넓은 부채꼴로 방울이 퍼져 폭발합니다.',size:46,cd:1.15,range:470,color:'#e1a8ff'},
    spring:{name:'스프링 펀치',desc:'스프링이 늘어나며 주먹이 멀리 날아갑니다.',size:45,cd:.82,range:260,color:'#ff5c4e'},
    spear:{name:'팝업 창',desc:'적당히 긴 창으로 여러 적을 빠르게 찌릅니다.',size:62,cd:.68,range:145,color:'#ffe08a'},
    sword:{name:'장난감 칼',desc:'가까운 적을 넓게 베어냅니다.',size:48,cd:.52,range:92,color:'#bfeaff'},
    hammer:{name:'수호 해머',desc:'강하게 내려쳐 적을 멀리 밀어냅니다.',size:52,cd:.94,range:82,color:'#ffd466'}
  };
  const WEAPON_RIG={
    nerf:{w:1.02,h:.46,pivot:.27,py:.66,support:.20,muzzle:.96,ranged:true},
    water:{w:1.08,h:.44,pivot:.27,py:.66,support:.23,muzzle:.97,ranged:true},
    bubble:{w:1.05,h:.48,pivot:.27,py:.67,support:.22,muzzle:.97,ranged:true},
    spring:{w:1.18,h:.44,pivot:.16,py:.68,support:.18,muzzle:.98,ranged:true},
    spear:{w:1.62,h:.25,pivot:.18,py:.50,support:.24,muzzle:.98,melee:true},
    sword:{w:1.02,h:.34,pivot:.17,py:.52,support:.13,muzzle:.98,melee:true},
    hammer:{w:1.13,h:.48,pivot:.15,py:.54,support:.16,muzzle:.92,melee:true}
  };
  const MODES={
    defense:{name:'과자 수비',play:'과자를 지키러 출발!',toast:'AI 수비대와 과자를 지켜라!',goal:'과자를 지키며 최대한 오래 버티세요.'},
    survival:{name:'생존전',play:'10웨이브 생존 출발!',toast:'10웨이브 동안 살아남아라!',goal:'과자 없이 10웨이브를 생존하세요.'},
    hunt:{name:'사냥전',play:'몬스터 사냥 출발!',toast:'목표 수만큼 몬스터를 사냥하라!',goal:'몬스터 160마리를 처치하세요.'}
  };
  const DIFFICULTIES={
    easy:{name:'쉬움',enemyHp:.72,enemyDmg:.62,spawn:1.32,core:3600},
    normal:{name:'보통',enemyHp:.90,enemyDmg:.82,spawn:1.12,core:3000},
    hard:{name:'어려움',enemyHp:1.18,enemyDmg:1.12,spawn:.92,core:2500}
  };
  const STAT_UPGRADES={
    attack:{name:'공격력 강화',icon:'⚔️',desc:'모든 무기 피해 +12%',apply:p=>p.attackMul*=1.12,value:p=>`×${p.attackMul.toFixed(2)}`},
    speed:{name:'이동 속도',icon:'👟',desc:'이동 속도 +10%',apply:p=>p.speed*=1.10,value:p=>Math.round(p.speed)},
    health:{name:'튼튼한 몸',icon:'❤️',desc:'최대 체력 +24, 체력 회복',apply:p=>{p.maxHp+=24;p.hp=Math.min(p.maxHp,p.hp+36);},value:p=>p.maxHp},
    crit:{name:'집중 렌즈',icon:'🎯',desc:'치명타 확률 +5%',apply:p=>p.crit=Math.min(.55,p.crit+.05),value:p=>`${Math.round(p.crit*100)}%`},
    armor:{name:'장난감 갑옷',icon:'🛡️',desc:'받는 피해 7% 감소',apply:p=>p.armor=Math.min(.42,p.armor+.07),value:p=>`${Math.round(p.armor*100)}%`},
    cooldown:{name:'태엽 가속',icon:'⏱️',desc:'모든 공격 간격 8% 감소',apply:p=>p.cooldownMul*=.92,value:p=>`×${p.cooldownMul.toFixed(2)}`},
    magnet:{name:'사탕 자석',icon:'🧲',desc:'경험치 획득 거리 +28',apply:p=>p.pickup+=28,value:p=>Math.round(p.pickup)}
  };

  function resize(){
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.35);topSafe=standalone?48:12;bottomSafe=standalone?26:10;
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
    const r=preview.getBoundingClientRect();preview.width=Math.max(1,Math.round(r.width*DPR));preview.height=Math.max(1,Math.round(r.height*DPR));pctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize',resize,{passive:true});resize();

  function uniqueAssetPaths(){
    const out=new Set(['assets/ui/main.webp',...Object.values(DATA.weapons),...DATA.pillbug]);
    Object.values(DATA.characters).forEach(c=>{out.add(c.smile);Object.values(c.directions).forEach(d=>out.add(d.file));});
    for(const key of ['croc','hippo','fly']) DATA[key].flat().forEach(p=>out.add(p));
    Object.values(DATA.snake).flat().forEach(p=>out.add(p));return [...out];
  }
  async function preload(){
    const paths=uniqueAssetPaths();let n=0;
    await Promise.all(paths.map(src=>new Promise(res=>{const im=new Image();im.onload=im.onerror=()=>{$('#loadFill').style.width=(++n/paths.length*100)+'%';res();};im.src=src;IMG[src]=im;})));
    loadDone=true;setTimeout(()=>{$('#loading').classList.add('hide');state='home';AudioMgr.bgm('main');},250);
  }

  const AudioMgr={
    ctx:null,master:null,bg:null,current:'',bgmVol:.32,sfxVol:.36,
    unlock(){if(!this.ctx){this.ctx=new (AudioContext||webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=this.sfxVol;this.master.connect(this.ctx.destination);}if(this.ctx.state==='suspended')this.ctx.resume();},
    bgm(name){if(this.current===name){if(this.bg)this.bg.volume=this.bgmVol;return;}this.current=name;if(this.bg){this.bg.pause();this.bg=null;}const a=new Audio(`assets/audio/${name}.mp3`);a.loop=true;a.volume=this.bgmVol;a.play().catch(()=>{});this.bg=a;},

  function drawObstacle(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(8,o.r*.38,o.r*.85,o.r*.34,0,0,TAU);ctx.fill();if(o.kind==='rock'){ctx.fillStyle='#657157';ctx.strokeStyle='#384638';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-o.r*.7,o.r*.3);ctx.lineTo(-o.r*.55,-o.r*.45);ctx.lineTo(.1*o.r,-o.r*.72);ctx.lineTo(o.r*.72,-o.r*.2);ctx.lineTo(o.r*.62,o.r*.5);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#87977b';ctx.beginPath();ctx.moveTo(-o.r*.4,-o.r*.28);ctx.lineTo(.05*o.r,-o.r*.5);ctx.stroke();}else if(o.kind==='log'||o.kind==='stump'){ctx.fillStyle='#78452c';roundRect(ctx,-o.r,-o.r*.28,o.r*2,o.r*.56,o.r*.25);ctx.fill();ctx.strokeStyle='#44291d';ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle='#bb7845';for(let x=-o.r*.6;x<o.r*.7;x+=o.r*.35){ctx.beginPath();ctx.moveTo(x,-o.r*.25);ctx.lineTo(x+8,o.r*.25);ctx.stroke();}}else if(o.kind==='can'){ctx.fillStyle='#5aa6b5';roundRect(ctx,-o.r*.65,-o.r*.38,o.r*1.3,o.r*.76,8);ctx.fill();ctx.strokeStyle='#d9eef0';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#f05c50';ctx.fillRect(-o.r*.5,-5,o.r,10);}else{ctx.fillStyle=pick(['#e45a42','#3c7fd6','#f2c946']);roundRect(ctx,-o.r*.7,-o.r*.7,o.r*1.4,o.r*1.4,8);ctx.fill();ctx.strokeStyle='#fff5';ctx.lineWidth=4;ctx.stroke();}ctx.restore();}

  function chooseCharDir(e){const a=e.aim!=null?e.aim:Math.atan2(e.moveY||1,e.moveX||0),x=Math.cos(a),y=Math.sin(a);if(y>.55)return['front',false];if(y<-.55)return['back',false];if(x>=0)return[Math.abs(y)<.3?'right':y>0?'lower_right':'upper_right',false];return[Math.abs(y)<.3?'right':y>0?'lower_right':'upper_right',true];}
  function cropPart(c,img,box,x,y,w,h,rot=0,flip=false,anchorY=.08){const sx=box[0]*img.width,sy=box[1]*img.height,sw=box[2]*img.width,sh=box[3]*img.height;c.save();c.translate(x,y);c.rotate(rot);if(flip)c.scale(-1,1);c.drawImage(img,sx,sy,sw,sh,-w/2,-h*anchorY,w,h);c.restore();}
  function weaponPose(e,size,bob,id){const aim=e.aim||0,active=e.attackT>0&&e.attackWeapon===id,q=active?clamp(1-e.attackT/e.attackDur,0,1):0,s=q*q*(3-2*q);let a=aim,reach=size*.12,recoil=active&&WEAPON_RIG[id].ranged?Math.sin(q*Math.PI)*size*.055:0;if(id==='sword')a=active?aim-1.05+s*1.95:aim-.48;else if(id==='hammer')a=active?aim-1.28+s*1.85:aim-.62;else if(id==='spear')reach+=active?Math.sin(q*Math.PI)*size*.29:0;else if(id==='spring')recoil=active?Math.sin(q*Math.PI)*size*.04:0;return{a,gx:e.x+Math.cos(aim)*(reach-recoil),gy:e.y-size*.08+bob+Math.sin(aim)*reach,q,active};}
  function drawArmTo(c,im,box,sx,sy,tx,ty,w,mirror){const a=Math.atan2(ty-sy,tx-sx),dist=Math.hypot(tx-sx,ty-sy),h=clamp(dist*1.10,w*1.55,w*3.80);cropPart(c,im,box,sx,sy,w,h,a-Math.PI/2,mirror,.045);}
  function drawToy(c,e,size=72,previewMode=false,t=clock){const [dir,mirror]=chooseCharDir(e),d=DATA.characters[e.char].directions[dir],im=IMG[d.file];if(!im||!im.complete)return;const bob=e.walk?Math.abs(Math.sin(t*10))*size*.035:Math.sin(t*2.4)*size*.012,phase=Math.sin(t*10),bodyH=size*.68,bodyW=size*.54,bodyY=e.y-size*.25+bob,legH=size*.27,legW=size*.16,hipY=e.y+size*.045+bob,armW=size*.14,shoulderY=e.y-size*.15+bob,shoulderX=size*.16,aim=e.aim||0,weapon=e.weapon||CHARS[e.char].weapon,weaponSize=WEAPONS[weapon].size/72*size*.92,pose=weaponPose(e,size,bob,weapon),side=mirror?-1:1,mainArm=mirror?'left_arm':'right_arm',supportArm=mirror?'right_arm':'left_arm',mainSX=e.x+side*shoulderX,supportSX=e.x-side*shoulderX,mainTX=pose.gx,mainTY=pose.gy,supportTX=supportSX-side*size*.025,supportTY=e.y+size*.09+bob;
    c.save();c.globalAlpha=.22;c.fillStyle='#07170b';c.beginPath();c.ellipse(e.x,e.y+size*.35,size*.30,size*.11,0,0,TAU);c.fill();c.restore();
    const legA=e.walk?phase*.34:0;cropPart(c,im,d.parts.left_leg,e.x-side*size*.075,hipY,legW,legH,-side*legA,mirror);cropPart(c,im,d.parts.right_leg,e.x+side*size*.075,hipY,legW,legH,side*legA,mirror);
    drawArmTo(c,im,d.parts[supportArm],supportSX,shoulderY,supportTX,supportTY,armW,mirror);
    cropPart(c,im,d.parts.body_head,e.x,bodyY,bodyW,bodyH,0,mirror,.5);
    if(e.smile&&dir==='front'){const sm=IMG[DATA.characters[e.char].smile];if(sm&&sm.complete){c.save();c.globalAlpha=Math.min(1,e.smileT?e.smileT*4:1);const s=size*.48;c.drawImage(sm,e.x-s/2,e.y-size*.55+bob,s,s);c.restore();}}
    drawWeapon(c,weapon,pose.gx,pose.gy,pose.a,weaponSize);
    drawArmTo(c,im,d.parts[mainArm],mainSX,shoulderY,mainTX,mainTY,armW,mirror);
  }
  function drawWeapon(c,id,x,y,a,size){const im=IMG[DATA.weapons[id]],r=WEAPON_RIG[id];if(!im||!im.complete)return;const w=size*r.w,h=size*r.h;c.save();c.translate(x,y);c.rotate(a);if(Math.cos(a)<0)c.scale(1,-1);c.drawImage(im,-w*r.pivot,-h*r.py,w,h);c.restore();}

  function drawEnemy(e){const s=worldToScreen(e.x,e.y);if(s.x<-180||s.x>W+180||s.y<-180||s.y>H+180)return;ctx.save();ctx.translate(s.x,s.y);const bounce=Math.abs(Math.sin(e.anim))*(e.type==='fly'?5:3),flash=e.flash>0;ctx.translate(0,-bounce);if(e.type==='snake'){ctx.rotate(e.dir);const im=IMG[DATA.snake.east[Math.floor(e.anim)%3]];const sz=300;ctx.globalAlpha=e.dead?e.deadT/.22:1;ctx.drawImage(im,-sz/2,-sz/2,sz,sz);}else{ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,e.r*.72,e.r*(e.air?1.25:1.05),e.r*.35,0,0,TAU);ctx.fill();let im=null,w=e.r*3,h=e.r*3;if(e.type==='pillbug'){im=IMG[DATA.pillbug[dirIndex(e.dir)]];w=h=e.r*3.3;}else{const set=DATA[e.type],idx=dirIndex(e.dir),frames=set[idx]||set[0];im=IMG[frames[Math.floor(e.anim)%frames.length]];w=h=e.r*(e.type==='hippo'?3.6:e.type==='croc'?3.7:3.6);}if(im){ctx.globalAlpha=e.dead?e.deadT/.22:1;ctx.drawImage(im,-w/2,-h/2,w,h);}}if(flash){ctx.globalCompositeOperation='screen';ctx.globalAlpha=.7;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,e.r,0,TAU);ctx.fill();}ctx.restore();if(!e.boss&&e.hp<e.maxHp){ctx.fillStyle='#2a1c1c';ctx.fillRect(s.x-e.r,s.y-e.r-12,e.r*2,5);ctx.fillStyle='#ff6c52';ctx.fillRect(s.x-e.r,s.y-e.r-12,e.r*2*(e.hp/e.maxHp),5);}}
  function drawProjectiles(){for(const p of G.projectiles){const s=worldToScreen(p.x,p.y);ctx.save();ctx.translate(s.x,s.y);if(p.type==='dart'){ctx.rotate(Math.atan2(p.vy,p.vx));ctx.fillStyle='#ff9a2f';roundRect(ctx,-10,-3,20,6,3);ctx.fill();ctx.fillStyle='#ffe37c';ctx.fillRect(5,-3,5,6);}else if(p.type==='bubble'){ctx.fillStyle=p.color;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(0,0,p.r,0,TAU);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3,-3,2,0,TAU);ctx.fill();}else if(p.type==='spring'){const o=worldToScreen(p.ox,p.oy);ctx.restore();ctx.save();ctx.strokeStyle='#d9dde3';ctx.lineWidth=4;ctx.beginPath();const n=12;for(let j=0;j<=n;j++){const q=j/n,x=o.x+(s.x-o.x)*q,y=o.y+(s.y-o.y)*q+Math.sin(q*n*Math.PI)*5;if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.fillStyle='#ff5a4d';ctx.beginPath();ctx.arc(s.x,s.y,17,0,TAU);ctx.fill();ctx.strokeStyle='#9e1f2d';ctx.lineWidth=4;ctx.stroke();}ctx.restore();}}
  function drawEnemyBullets(){for(const b of G.enemyBullets){const s=worldToScreen(b.x,b.y);const g=ctx.createRadialGradient(s.x-2,s.y-2,1,s.x,s.y,b.r*2);g.addColorStop(0,'#eaffb1');g.addColorStop(.4,'#7dff40');g.addColorStop(1,'#2c741000');ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,b.r*2,0,TAU);ctx.fill();ctx.fillStyle='#62e72f';ctx.beginPath();ctx.arc(s.x,s.y,b.r,0,TAU);ctx.fill();}}
  function drawDrops(){for(const d of G.drops){const s=worldToScreen(d.x,d.y),b=Math.sin(d.t*6)*3;ctx.save();ctx.translate(s.x,s.y+b);ctx.rotate(d.t*2);ctx.fillStyle=d.xp>20?'#ffcf35':'#ff8d45';ctx.fillRect(-7,-7,14,14);ctx.fillStyle='#fff2a3';ctx.beginPath();ctx.moveTo(-7,-5);ctx.lineTo(-13,0);ctx.lineTo(-7,5);ctx.fill();ctx.beginPath();ctx.moveTo(7,-5);ctx.lineTo(13,0);ctx.lineTo(7,5);ctx.fill();ctx.restore();}}
  function drawEffects(){for(const f of G.effects){const s=worldToScreen(f.x,f.y),k=f.t/(f.t+f.life);ctx.save();ctx.globalAlpha=1-k;if(f.type==='muzzle'){ctx.translate(s.x,s.y);ctx.rotate(f.a);ctx.fillStyle='#fff8b2';ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(40,0);ctx.lineTo(11,-16);ctx.lineTo(17,0);ctx.lineTo(11,16);ctx.closePath();ctx.fill();ctx.globalAlpha=.55*(1-k);ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(4,0,23*(1-k),0,TAU);ctx.fill();}else if(f.type==='water'){const e=worldToScreen(f.x2,f.y2);ctx.strokeStyle='#78edff';ctx.lineWidth=13*(1-k);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo((s.x+e.x)/2,(s.y+e.y)/2+Math.sin(f.t*40)*9,e.x,e.y);ctx.stroke();ctx.strokeStyle='#e7ffff';ctx.lineWidth=4*(1-k);ctx.stroke();}else if(f.type==='slash'||f.type==='slash2'||f.type==='smash'){ctx.translate(s.x,s.y);ctx.rotate(f.a);ctx.lineCap='round';const wide=f.type==='smash'?18:f.type==='slash2'?5:12;ctx.strokeStyle=f.color;ctx.lineWidth=wide*(1-k*.45);ctx.beginPath();ctx.arc(0,0,f.rad,-1.05+k*.32,1.05-k*.18);ctx.stroke();if(f.type!=='smash'){ctx.globalAlpha=.65*(1-k);ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,f.rad-7,-.92,.92);ctx.stroke();}}else if(f.type==='stab'){ctx.translate(s.x,s.y);ctx.rotate(f.a);ctx.strokeStyle='#fff7c4';ctx.lineCap='round';ctx.lineWidth=13*(1-k);ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(f.len*(.68+.32*k),0);ctx.stroke();ctx.strokeStyle=f.color;ctx.lineWidth=5*(1-k);ctx.stroke();}else if(f.type==='tipBurst'){ctx.translate(s.x,s.y);ctx.rotate(f.a);ctx.fillStyle=f.color;for(let i=0;i<6;i++){ctx.rotate(TAU/6);ctx.beginPath();ctx.moveTo(0,-3);ctx.lineTo((f.rad||24)*(1-k*.45),0);ctx.lineTo(0,3);ctx.closePath();ctx.fill();}}else if(f.type==='shock'){ctx.translate(s.x,s.y);ctx.strokeStyle=f.color;ctx.lineWidth=10*(1-k);ctx.beginPath();ctx.ellipse(0,8,(f.rad||50)*(.45+k*.7),(f.rad||50)*(.18+k*.28),0,0,TAU);ctx.stroke();for(let i=0;i<8;i++){ctx.rotate(TAU/8);ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo((f.rad||50)*(.65+k*.45),0);ctx.stroke();}}else if(f.type==='hit'){ctx.translate(s.x,s.y);ctx.rotate(f.a);ctx.strokeStyle=f.color;ctx.lineWidth=5;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-10,i*7);ctx.lineTo(16,i*10);ctx.stroke();}}else{ctx.translate(s.x,s.y);ctx.strokeStyle=f.color;ctx.lineWidth=8*(1-k);ctx.beginPath();ctx.arc(0,0,(f.rad||35)*(.35+k*.9),0,TAU);ctx.stroke();if(f.type==='death'||f.type==='teamSpawn'){ctx.fillStyle=f.color;ctx.globalAlpha=.18*(1-k);ctx.beginPath();ctx.arc(0,0,(f.rad||35)*(1-k*.3),0,TAU);ctx.fill();}}ctx.restore();}
    for(const p of G.particles){const s=worldToScreen(p.x,p.y);ctx.globalAlpha=clamp(p.life*3,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(s.x,s.y,p.r,0,TAU);ctx.fill();}ctx.globalAlpha=1;for(const n of G.numbers){const s=worldToScreen(n.x,n.y-n.t*40);ctx.globalAlpha=clamp(n.life*2,0,1);ctx.font='900 18px system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#152011';ctx.strokeText(n.text,s.x,s.y);ctx.fillStyle=n.color;ctx.fillText(n.text,s.x,s.y);}ctx.globalAlpha=1;}
  function drawChargeWarn(){const b=G.boss;if(!b||b.state!=='chargeWarn'||!b.charge)return;const s=worldToScreen(b.charge.x,b.charge.y);ctx.save();ctx.translate(s.x,s.y);ctx.rotate(b.charge.a);ctx.fillStyle=`rgba(255,44,35,${.18+Math.sin(clock*15)*.08})`;ctx.fillRect(0,-58,b.charge.len,116);ctx.strokeStyle='#ff3c32';ctx.lineWidth=4;ctx.setLineDash([22,14]);ctx.strokeRect(0,-58,b.charge.len,116);ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='900 34px system-ui';for(let x=70;x<b.charge.len;x+=120)ctx.fillText('➤',x,11);ctx.restore();}
  function drawHUD(){const y=topSafe+7,w=Math.min(W-28,650),x=(W-w)/2,barW=w-105;ctx.fillStyle='rgba(18,31,23,.78)';roundRect(ctx,x,y,barW,25,12);ctx.fill();ctx.font='800 14px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';if(G.mode==='defense'){ctx.fillStyle='#ffca57';roundRect(ctx,x+2,y+2,(barW-4)*clamp(CORE.hp/CORE.maxHp,0,1),21,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(`과자 ${Math.max(0,Math.ceil(CORE.hp))}/${CORE.maxHp}`,x+barW/2,y+18);}else if(G.mode==='survival'){ctx.fillStyle='#6fe2ff';roundRect(ctx,x+2,y+2,(barW-4)*clamp((G.wave-1+G.waveT/G.waveLen)/10,0,1),21,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(`생존 목표 ${Math.min(G.wave,10)}/10 웨이브`,x+barW/2,y+18);}else{ctx.fillStyle='#ffbf55';roundRect(ctx,x+2,y+2,(barW-4)*clamp(G.kills/G.huntGoal,0,1),21,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(`사냥 목표 ${G.kills}/${G.huntGoal}`,x+barW/2,y+18);}
    ctx.fillStyle='rgba(18,31,23,.84)';roundRect(ctx,x+w-96,y,58,34,13);ctx.fill();ctx.font='900 14px system-ui';ctx.fillStyle='#fff4a5';ctx.fillText(formatTime(G.time),x+w-67,y+22);roundRect(ctx,x+w-32,y,32,34,11);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+w-24,y+9,5,17);ctx.fillRect(x+w-14,y+9,5,17);
    const p=G.p;const hpY=y+36;ctx.fillStyle='#152719cc';roundRect(ctx,x,hpY,150,12,6);ctx.fill();ctx.fillStyle='#64db80';roundRect(ctx,x+1,hpY+1,148*clamp(p.hp/p.maxHp,0,1),10,5);ctx.fill();ctx.font='800 11px system-ui';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(`HP ${Math.max(0,Math.ceil(p.hp))}`,x+5,hpY+10);
    if(G.boss){const bw=Math.min(W-40,520),bx=(W-bw)/2,by=topSafe+68;ctx.fillStyle='#28121b';roundRect(ctx,bx,by,bw,20,9);ctx.fill();ctx.fillStyle='#8fe441';roundRect(ctx,bx+2,by+2,(bw-4)*clamp(G.boss.hp/G.boss.maxHp,0,1),16,7);ctx.fill();ctx.textAlign='center';ctx.font='900 13px system-ui';ctx.fillStyle='#fff';ctx.fillText('밀림의 뱀 대장',W/2,by+15);}
    const xpY=H-bottomSafe-13;ctx.fillStyle='#14251bd9';roundRect(ctx,16,xpY,W-32,10,5);ctx.fill();ctx.fillStyle='#72e5ff';roundRect(ctx,17,xpY+1,(W-34)*clamp(p.xp/p.nextXp,0,1),8,4);ctx.fill();ctx.textAlign='center';ctx.font='900 12px system-ui';ctx.fillStyle='#fff';ctx.fillText(`Lv.${p.level}  ·  WAVE ${G.wave}`,W/2,xpY-4);
    if(input.touch){ctx.globalAlpha=.5;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(input.ox,input.oy,54,0,TAU);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(input.ox+input.x*42,input.oy+input.y*42,22,0,TAU);ctx.fill();ctx.globalAlpha=1;}}
  function formatTime(t){const m=(t/60)|0,s=(t%60)|0;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
  function drawFighter(f,size=68,team=false){if(f.dead)return;const s=worldToScreen(f.x,f.y);drawToy(ctx,{...f,x:s.x,y:s.y,weapon:f.weapons[0].id,weaponLv:f.weapons[0].lv},size,false,clock);if(team){const w=46,x=s.x-w/2,y=s.y-size*.58;ctx.fillStyle='#173323cc';roundRect(ctx,x,y,w,5,3);ctx.fill();ctx.fillStyle='#7bffb0';roundRect(ctx,x+1,y+1,(w-2)*clamp(f.hp/f.maxHp,0,1),3,2);ctx.fill();ctx.font='800 8px system-ui';ctx.textAlign='center';ctx.fillStyle='#edfff2';ctx.fillText('AI',s.x,y-2);}}
  function draw(){drawMap();drawChargeWarn();const sorted=G.enemies.filter(e=>!e.dead||e.deadT>0).sort((a,b)=>a.y-b.y);for(const e of sorted)drawEnemy(e);drawDrops();drawProjectiles();drawEnemyBullets();for(const a of G.allies)drawFighter(a,66,true);drawFighter(G.p,72,false);drawEffects();drawHUD();}

  function endGame(win){if(state==='gameover')return;state='gameover';const p=G.p;$('#overTitle').textContent=win?`${MODES[G.mode].name} 성공!`:G.mode==='defense'?'과자를 빼앗겼어요!':'장난감 원정대가 쓰러졌어요!';$('#overStats').innerHTML=statHtml(G.wave,'도달 웨이브')+statHtml(G.kills,'몬스터 처치')+statHtml(p.level,'레벨');showScreen('#gameover');}
  function loop(now){requestAnimationFrame(loop);const raw=(now-last)/1000;last=now;clock=now/1000;if(state==='play'&&G){const dt=Math.min(.033,raw);update(dt);draw();}else if(state==='pause'||state==='levelup'||state==='gameover'){if(G)draw();}}
  preload();requestAnimationFrame(loop);
  </script>
